name: Actualizar datos multipaís

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    outputs:
      publicar: ${{ steps.refrescar.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multipais
          path: sitio
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar estado de alertas
        uses: actions/cache/restore@v4
        with:
          path: sitio/data
          key: multipais-data-v2-sin-coincidencia
          restore-keys: multipais-data-v2-

      - id: refrescar
        name: Descargar y evaluar datos de los tres países
        timeout-minutes: 8
        working-directory: sitio
        run: python fuente/actualizar.py

      - name: Guardar estado de alertas
        if: steps.refrescar.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: sitio/data
          key: multipais-data-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publicar datos actualizados en multipais
        if: steps.refrescar.outputs.publicar == 'true'
        working-directory: sitio
        run: |
          set -eu
          git config user.name "rius-bot"
          git config user.email "rius-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
            exit 0
          fi
          git commit -q -m "datos: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:multipais

      - name: Notificar cambios relevantes
        if: always() && steps.refrescar.outcome == 'success'
        working-directory: sitio
        env:
          GH_TOKEN: ${{ github.token }}
        run: python fuente/notificar.py

  build:
    if: needs.actualizar.outputs.publicar == 'true'
    needs: actualizar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multipais

      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html d3.min.js .nojekyll _site/
          cp -R data modulos _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
