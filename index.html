/* Diseño base de Pablo Dodda (nivelrio): variables de color, tipografía de sistema, tarjetas y escalas. */
:root {
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --bg: #f7f6f2; --panel: #ffffff; --fg: #1f1e1b; --muted: #6b6860; --line: #e3e0d8; --grid: #ece9e1;
  --n0: #2e7d4f; --n1: #a07d0a; --n2: #c46a12; --n3: #c0392b; --sd: #8a867c;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191917; --panel: #23221f; --fg: #ecebe6; --muted: #a3a097; --line: #3a3833; --grid: #302f2b;
    --n0: #5fbf85; --n1: #e0c04a; --n2: #f0a04b; --n3: #ef6f61; --sd: #8f8b81; --accent: #6ea3ff; --rn: #4f9a90;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {

  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: var(--fs-body);
  padding-block: 20px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin-inline: auto; display: grid; gap: var(--gap-lg); }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--gap-md); align-items: flex-start; }
.top > div { min-width: 0; }
h1 { font-family: var(--font-serif); font-weight: 400; font-size: var(--fs-title); line-height: 1.15; margin: 0 0 var(--gap-xs); text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 46rem; line-height: 1.5; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.seg button { background: transparent; color: var(--muted); border: 0; padding: 7px 12px; font: inherit; font-size: var(--fs-cap); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 600; }
.tabs { display: flex; gap: var(--gap-xs); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 9px 14px;
  font: inherit; font-size: var(--fs-head); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 8px; align-items: baseline; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }
.tabs button:hover { color: var(--fg); }
.tabs .badge { font-size: var(--fs-cap); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--c); }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.banner { border: 1px solid var(--n2); color: var(--fg); background: var(--panel); border-left: 4px solid var(--n2); border-radius: var(--radius); padding: 10px 14px; line-height: 1.45; }
.banner.err { border-color: var(--n3); border-left-color: var(--n3); }
.banners { display: grid; gap: var(--gap-sm); }
.banners:empty { display: none; }
.tiles { display: grid; gap: var(--gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; border-top: 3px solid var(--c); }
.tile .k { font-size: var(--fs-cap); color: var(--muted); }
.tile .n { font-family: var(--font-serif); font-size: var(--fs-title); line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .r { font-size: var(--fs-cap); color: var(--muted); margin-top: 2px; min-height: 1.4em; }
.avisos, .prev { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; }
.avisos h2, .sec h2, .prev h2 { font-size: var(--fs-head); font-weight: 600; margin: 0; }
.av { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.av .src { font-size: var(--fs-cap); color: var(--muted); }
.avisos details summary { cursor: pointer; color: var(--muted); font-size: var(--fs-cap); }
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: var(--fs-cap); border: 1px solid currentColor; color: var(--c); white-space: nowrap; font-weight: 600; }
.bar { display: flex; flex-wrap: wrap; gap: var(--gap-md); justify-content: space-between; align-items: center; }
.grid { display: grid; gap: var(--gap-md); grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; display: grid; gap: 10px; align-content: start; border-top: 3px solid var(--c); }
.card.n0 { border-top-color: var(--line); }
.ch { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ch > div { min-width: 0; }
.tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.rio { font-size: var(--fs-cap); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.est { font-size: var(--fs-head); font-weight: 600; margin-top: 1px; overflow-wrap: anywhere; }
.val { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big { font-family: var(--font-serif); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big small { font-family: var(--font-sans); font-size: var(--fs-body); color: var(--muted); }
.tr { font-size: var(--fs-cap); font-variant-numeric: tabular-nums; color: var(--muted); }
.tr.up { color: var(--n2); font-weight: 600; }
svg.sp { width: 100%; height: auto; display: block; }
.sp .gr, .ch2 .gr { stroke: var(--grid); stroke-width: 1; }
.sp .tl, .ch2 .tl { stroke-width: 1; stroke-dasharray: 4 3; }
.sp .lb, .sp .ax, .ch2 text { font-size: 10px; fill: var(--muted); }
.lad { display: flex; gap: 2px; height: 8px; }
.lad i { flex: 1; background: var(--grid); border-radius: 2px; }
.lad i.on { background: var(--c); }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: var(--fs-cap); color: var(--muted); line-height: 1.4; }
.sdnote { font-size: var(--fs-cap); color: var(--muted); }
.foot { color: var(--muted); font-size: var(--fs-cap); line-height: 1.6; border-top: 1px solid var(--line); padding-top: var(--gap-md); }
.foot p { margin: 0 0 var(--gap-xs); max-width: 56rem; }
.foot b { color: var(--fg); }

.ptab td { padding: 7px 8px; background: var(--bg); }
.ptab td.z { border-radius: 8px 0 0 8px; font-weight: 600; min-width: 9rem; }
.ptab td:last-child { border-radius: 0 8px 8px 0; }
.ptab td.c { text-align: center; border-left: 3px solid var(--c); white-space: nowrap; }
.ptab td.c b { font-weight: 600; }
.ptab td.c small { color: var(--muted); font-size: 11px; margin-left: 4px; }
.pwrap { overflow-x: auto; }
.pnote { font-size: var(--fs-cap); color: var(--muted); line-height: 1.5; margin: 0; max-width: 56rem; }
.fc { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.fc .fh { font-size: var(--fs-cap); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fc .fl { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.fc .fl b { font-weight: 600; }
.fc .fchip { justify-self: start; }
details.det { border-top: 1px solid var(--line); padding-top: 8px; }
details.det > summary { cursor: pointer; font-size: var(--fs-cap); color: var(--muted); }
.srow { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.srow .h b { font-weight: 600; overflow-wrap: anywhere; }
.chbox { min-height: 170px; }
.ch2 { width: 100%; height: auto; display: block; }
.rng { justify-self: start; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.empty { color: var(--muted); font-size: var(--fs-cap); padding: 8px 0; }
.mods { display: grid; gap: 12px; margin-top: 4px; }
.mh { font-size: var(--fs-body); font-weight: 600; margin: 0; }
.mnote { display: grid; gap: 4px; font-size: var(--fs-cap); color: var(--muted); line-height: 1.5; }
.mnote p { margin: 0; max-width: 56rem; }
.mnote .vencido { color: var(--fg); font-weight: 600; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.leg i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--c); vertical-align: middle; margin-right: 5px; }
.leg i.pr { border-top-style: dashed; }
.sim, .mhist { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.sim label { font-size: var(--fs-cap); color: var(--muted); }
.sim input { font: inherit; font-size: 16px; min-height: 40px; width: 100%; max-width: 12rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font-variant-numeric: tabular-nums; }

.simout { min-height: 1.4em; display: grid; gap: 4px; }

.hl { margin: 0; padding-left: 1.1rem; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }

.fb-punta { fill: none; stroke: var(--rn); stroke-width: 2; }

.fb-arena { fill: #c9a63e; opacity: .42; }

.fb-c.p3 .fb-union { opacity: .3; }
.fb-c.p3 line.fb-union { opacity: 1; }
.fb-cap { font-weight: 600; }
.fb-ctl { display: flex; flex-wrap: wrap; gap: 8px; }
.fb-btn { font: inherit; font-size: var(--fs-cap); min-height: 40px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--fg); cursor: pointer; }

@media (prefers-reduced-motion: no-preference) {

}

e. Solo se muestran algunas estaciones del Paraná y del Uruguay. Los ríos sin umbral muestran solo la altura.","Fuentes: Instituto Nacional del Agua (INA), Administración General de Puertos (AGP) y Open-Meteo.com (CC BY 4.0). Alerta y evacuación son los niveles que publica el INA; Vigilancia es una regla propia de esta página (90 % del nivel de alerta) y no es oficial. En Barranqueras se usan los niveles de aviso de la Administración Provincial del Agua del Chaco."]},"es":{"nombre":"España","titulo":"Rius de Catalunya","desc":"Caudal de los ríos de Catalunya con más riesgo de inundación, con contexto de Valencia (Túria, Xúquer, Poyo). Lecturas de la ACA y la CHJ, actualizadas cada hora o antes si cambia un nivel.","sub":"Caudal de los ríos de Catalunya con más riesgo de inundación, más contexto de Valencia. Se actualiza cada hora, o antes si cambia un nivel.","prev_note":"Lluvia acumulada por día (mm) y probabilidad máxima, el valor más alto entre las estaciones de cada zona. Fuente: Open-Meteo.com (CC BY 4.0). No existe una previsión oficial de caudales para estos ríos: el caudal esperado de cada tarjeta sale de un modelo global (GloFAS, malla de unos 5 km, un dato por día). Sirve de orientación y no capta las crecidas rápidas de rambla. La previsión nunca cambia el nivel de alerta.","foot":["<b>Informativo.<\/b> Datos provisionales sin validar. No sustituye a Protecció Civil. Siga siempre sus instrucciones. En una emergencia llame al 112.","<b>Límites.<\/b> Cuencas rápidas como la rambla del Poyo pueden crecer en menos de una hora, más rápido que esta página. Segre, Ebre y Noguera todavía no tienen estación en la página porque falta una fuente de datos fiable. Los ríos sin umbral muestran solo el caudal.","Fuentes: Agència Catalana de l'Aigua (ACA), Confederación Hidrográfica del Júcar (SAIH), AEMET, Protecció Civil de Catalunya (INUNCAT) y Open-Meteo.com (CC BY 4.0). Los niveles Vigilancia, Aviso y Peligro son una escala propia de esta página, no una escala oficial. Los umbrales de Catalunya son estimaciones calculadas a partir de la serie histórica; los de Valencia son los oficiales de la CHJ."]},"us":{"nombre":"EE. UU.","titulo":"Ríos del centro de Estados Unidos","desc":"Nivel del río Mississippi en St. Louis. Lecturas del USGS, actualizadas en esta página cada hora.","sub":"Nivel del río Mississippi en St. Louis, en pies, tal como lo publica el USGS.","prev_note":"Lluvia acumulada por día (mm) y probabilidad máxima, el valor más alto entre las estaciones de cada zona. Fuente: Open-Meteo.com (CC BY 4.0). Esta página todavía no muestra el pronóstico de río del Servicio Meteorológico Nacional (NWS). La previsión nunca cambia el nivel de alerta.","foot":["<b>Informativo.<\/b> Datos provisionales sin validar. No sustituye al Servicio Meteorológico Nacional (NWS) ni a las autoridades locales de emergencias. Siga siempre sus instrucciones. En una emergencia llame al 911.","<b>Límites.<\/b> Solo se muestran algunas estaciones. Una creciente en un afluente pequeño puede no verse aquí. Los niveles se ven en pies, como los publica la fuente, sin convertir.","Fuentes: U.S. Geological Survey (USGS), National Weather Service (NWS) y Open-Meteo.com (CC BY 4.0). Los niveles Vigilancia, Aviso y Peligro son una escala propia de esta página, no una escala oficial. Cuando el NWS publica categorías de inundación para la estación (acción, menor, moderada), se usan como umbrales; si no, la estación muestra solo la altura."]}},"mod_chart_h":"Evolución y pronóstico","mod_chart_summary":"Entre {desde} y {hasta} la lectura osciló entre {min} y {max}. Última lectura: {ultimo}.","mod_chart_aria":"Gráfico de la lectura de la estación con su pronóstico, si lo hay. El resumen en texto está justo debajo.","mod_leyenda_obs":"Lectura","mod_prono_nws":"Pronóstico oficial del NWS","mod_prono_manual":"Pronóstico manual","mod_prono_resumen":"{label} ({fecha}). Último punto: {punto}.","mod_prono_punto":"{valor} el {dia}","mod_prono_rango":"entre {min} y {max} "avisos oficials","prevision":"previsió","ina":"INA (Argentina)","agp":"AGP (port de Barranqueras)","usgs":"USGS (EUA)"},"loading":"Carregant dades…","error_load":"No s'han pogut carregar les dades. Es tornarà a provar d'aquí a uns minuts.","foot":["Fet per Pablo Dodda. Adaptació a Catalunya i a més països: Sebastian Andrada. Llicència MIT."],"aviso_color":{"amarillo":"groc","naranja":"taronja","rojo":"vermell"},"last_level":"Darrer nivell conegut","ago_updated":"Actualitzat","noscript":"Aquesta pàgina necessita JavaScript per mostrar les dades.","details_show":"Veure estacions i historial","title":"Nivell dels rius","desc":"Nivell i cabal de rius amb risc de crescuda a l'Argentina, Espanya i els Estats Units. Dades d'organismes públics, amb una escala d'alerta pròpia, actualitzades cada hora o abans si canvia un nivell.","tab_label":"País","pais_sin_datos":"Encara no hi ha dades d'aquest país. Apareixeran quan es completi la primera lectura.","pais_desconocido":"Aquest país no existeix a l'adreça. Es mostra {pais}.","paises":{"ar":{"nombre":"Argentina","titulo":"Rius del litoral argentí","desc":"Alçada del Paraná i de l'Uruguai al litoral argentí. Lectures de l'INA i de l'Administración General de Puertos, actualitzades en aquesta pàgina cada hora.","sub":"Alçada del Paraná i de l'Uruguai al litoral argentí, en metres. L'INA publica un valor per dia; el port de Barranqueras, un per hora.","prev_note":"Pluja acumulada per dia (mm) i probabilitat màxima, el valor més alt entre les estacions de cada zona. Font: Open-Meteo.com (CC BY 4.0). Aquesta pàgina no mostra cap previsió d'alçada del riu. La previsió mai no canvia el nivell d'alerta.","foot":["<b>Informatiu.<\/b> Dades provisionals sense validar. No substitueix Defensa Civil ni els avisos de la vostra província. Seguiu sempre les seves instruccions. En una emergència truqueu al 911.","<b>Límits.<\/b> L'INA actualitza un valor per dia, de manera que una crescuda ràpida pot trigar a veure's. Només es mostren algunes estacions del Paraná i de l'Uruguai. Els rius sense llindar només mostren l'alçada.","Fonts: Instituto Nacional del Agua (INA), Administración General de Puertos (AGP) i Open-Meteo.com (CC BY 4.0). Alerta i evacuació són els nivells que publica l'INA; Vigilància és una regla pròpia d'aquesta pàgina (90 % del nivell d'alerta) i no és oficial. A Barranqueras s'usen els nivells d'avís de l'Administración Provincial del Agua del Chaco."]},"es":{"nombre":"Espanya","titulo":"Rius de Catalunya","desc":"Cabal dels rius de Catalunya amb més risc d'inundació, amb context de València (Túria, Xúquer, Poyo). Lectures de l'ACA i la CHJ, actualitzades cada hora o abans si canvia un nivell.","sub":"Cabal dels rius de Catalunya amb més risc d'inundació, més context de València. S'actualitza cada hora, o abans si canvia un nivell.","prev_note":"Pluja acumulada per dia (mm) i probabilitat màxima, el valor més alt entre les estacions de cada zona. Font: Open-Meteo.com (CC BY 4.0). No hi ha cap previsió oficial de cabals per a aquests rius: el cabal esperat de cada targeta surt d'un model global (GloFAS, malla d'uns 5 km, una dada per dia). Serveix d'orientació i no capta les crescudes ràpides de riera. La previsió mai no canvia el nivell d'alerta.","foot":["<b>Informatiu.<\/b> Dades provisionals sense validar. No substitueix Protecció Civil. Seguiu sempre les seves instruccions. En una emergència truqueu al 112.","<b>Límits.<\/b> Les conques ràpides com la rambla del Poyo poden créixer en menys d'una hora, més de pressa que aquesta pàgina. Segre, Ebre i Noguera encara no tenen estació a la pàgina perquè falta una font de dades fiable. Els rius sense llindar només mostren el cabal.","Fonts: Agència Catalana de l'Aigua (ACA), Confederación Hidrográfica del Júcar (SAIH), AEMET, Protecció Civil de Catalunya (INUNCAT) i Open-Meteo.com (CC BY 4.0). Els nivells Vigilància, Avís i Perill són una escala pròpia d'aquesta pàgina, no una escala oficial. Els llindars de Catalunya són estimacions calculades a partir de la sèrie històrica; els de València són els oficials de la CHJ."]},"us":{"nombre":"EUA","titulo":"Rius del centre dels Estats Units","desc":"Nivell del riu Mississippi a St. Louis. Lectures de l'USGS, actualitzades en aquesta pàgina cada hora.","sub":"Nivell del riu Mississippi a St. Louis, en peus, tal com el publica l'USGS.","prev_note":"Pluja acumulada per dia (mm) i probabilitat màxima, el valor més alt entre les estacions de cada zona. Font: Open-Meteo.com (CC BY 4.0). Aquesta pàgina encara no mostra el pronòstic de riu del Servei Meteorològic Nacional (NWS). La previsió mai no canvia el nivell d'alerta.","foot":["<b>Informatiu.<\/b> Dades provisionals sense validar. No substitueix el Servei Meteorològic Nacional (NWS) ni les autoritats locals d'emergències. Seguiu sempre les seves instruccions. En una emergència truqueu al 911.","<b>Límits.<\/b> Només es mostren algunes estacions. Una crescuda en un afluent petit pot no veure's aquí. Els nivells es veuen en peus, com els publica la font, sense convertir.","Fonts: U.S. Geological Survey (USGS), National Weather Service (NWS) i Open-Meteo.com (CC BY 4.0). Els nivells Vigilància, Avís i Perill són una escala pròpia d'aquesta pàgina, no una escala oficial. Quan el NWS publica categories d'inundació per a l'estació (acció, menor, moderada), s'usen com a llindars; si no, l'estació mostra només l'alçada."]}},"mod_chart_h":"Evolució i pronòstic","mod_chart_summary":"Entre {desde} i {hasta} la lectura ha oscil·lat entre {min} i {max}. Última lectura: {ultimo}.","mod_chart_aria":"Gràfic de la lectura de l'estació amb el seu pronòstic, si n'hi ha. El resum en text és just a sota.","mod_leyenda_obs":"Lectura","mod_prono_nws":"Pronòstic oficial de l'NWS","mod_prono_manual":"Pronòstic manual","mod_prono_resumen":"{label} ({fecha}). Últim punt: {punto}.","mod_prono_punto":"{valor} el {dia}","mod_prono_rango":"entre {min} i {max} el {dia}","mod_prono_vencido":"Caducat: té més de 36 h.","mod_prono_aviso"   function resumenPais(entrada) {

    (Array.isArray(e.por_nivel) ? e.por_nivel : []).slice(0, 4).forEach((v, i) => { porNivel[i] = Number(v) || 0; });
    return { n: Number(e.estaciones) || 0, porNivel, sd: Number(e.sd) || 0 };
  }

  // La unidad se muestra como la publica la fuente: metros en Argentina, pies en EE. UU., sin convertir.
  const UNIDADES = { m3s: "m³/s", m: "m", ft: "ft", mm: "mm" };
  function unidadTexto(unidad) { return UNIDADES[unidad] || ""; }

  function formatoValor(valor, unidad, lang) {

    const ok = u && u.tipo !== "en_estudio" && esNumero(u.bajo) && esNumero(u.medio) && esNumero(u.alto);
    if (!ok) return { nivel: null, textoClave: "mod_sim_sin_umbrales", distancias: SIN_DISTANCIAS() };

    const chip = (p.puede_llegar && !e.sd)
      ? `<span class="tag fchip" style="--c:${COL[p.puede_llegar]}"><span aria-hidden="true">${L.nivelRotulo(p.puede_llegar, false, lang).simbolo}</span> ${esc(t().fcmay)} ${esc(L.nivelRotulo(p.puede_llegar, false, lang).texto)}</span>` : "";
    const q = e.unidad && e.unidad !== "m3s" ? "" : p.caudal ? `<span>${esc(t().fcq)}: <b>${num(p.caudal[0])}–${val(p.caudal[1], "m3s")}</b> <span class="sdnote">(${esc(t().fcwarn)})</span></span>` : `<span class="sdnote">${esc(t().fcnone)}</span>`;
    const lluvia = p.lluvia_48h_mm == null ? "" : `<span>${esc(t().rain48)}: <b>${val(p.lluvia_48h_mm, "mm")}</b></span>`;
    return `<div class="fc"><div class="fh">${esc(t().forecast_h)}</div><div class="fl">${lluvia}${q}</div>${chip}</div>`;
  }

  function tarjeta(g) {
    const e = g.principal, r = L.nivelRotulo(e.nivel, false, lang);
    const color = e.sd && e.nivel < 2 ? COL[4] : COL[e.nivel];
    const tags = e.sd
      ? tag(e.nivel, true) + `<span class="tag" style="--c:${COL[e.nivel]}" title="${esc(t().last_level)}"><span aria-hidden="true">${r.simbolo}</span> ${esc(r.texto)}</span>`
      : tag(e.nivel, false);
    const hist = D.hist[e.id] || [];
    const tend = L.tendencia(L.serieConActual(hist, e.t_utc, e.valor));
    const trTxt = e.sd || !tend ? "" : tend === "sube" ? `▲ ${t().rise}` : tend === "baja" ? `▼ ${t().fall}` : `● ${t().flat}`;
    const valor = e.valor == null
      ? `<div class="big" style="color:var(--sd)">—</div><div class="tr">${esc(t().no_value)}</div>`
      : `<div class="big">${num(e.valor)} <small>${esc(uni(e))}</small></div><div class="tr ${tend === "sube" && e.nivel >= 1 ? "up" : ""}">${esc(trTxt)}</div>`;
    const pts = L.filtrarRango(hist, Date.now(), 48);
    const spark = pts.length >= 3 ? sparkline(pts, e.umbrales, e.nivel, e.sd, e.unidad) : "";
    const lad = [1, 2, 3].map((k) => `<i class="${e.nivel >= k && !e.sd ? "on" : ""}" style="--c:${COL[k]}"></i>`).join("");
    const nota = e.sd ? `<div class="sdnote">${esc(t().sd_note)}</div>` : "";
    const detalle = `<details class="det" data-rio="${esc(g.rio)}"><summary>${esc(t().stations_of)} (${g.estaciones.length}) · ${esc(t().chart_title.toLowerCase())}</summary><div class="dbody"></div></details>`;
    return `<article class="card n${e.nivel}" style="--c:${color}">
      <div class="ch"><div><div class="rio">${esc(g.rio)}</div><div class="est">${esc(e.nombre)}</div></div><div class="tags">${tags}</div></div>
      <div class="val">${valor}</div>${spark}
      <div class="lad" aria-hidden="true">${lad}</div>${nota}
      ${bloquePrevision(e)}
      <div class="meta"><span>${esc(umbralesTexto(e.umbrales, e.unidad))}</span><span>${esc(L.tipoUmbralTexto(e.umbrales.tipo, lang))}</span></div>
      <div class="meta"><span>${esc(L.edadTexto(L.edadMin(e.t_utc, Date.now()), lang))}</span><span>${esc(t().source)}: ${esc(FUENTES[e.fuente] || e.fuente)}</span></div>
      ${detalle}
    </article>`;
  }

  // ---------- módulos de ficha: archivos por río ----------
  const fmt = (txt, vars) => String(txt).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  const dia = (iso) => new Date(iso).toLocaleDateString(loc(), { day: "numeric", month: "short", timeZone: ZONA_HORARIA[pais] });
  const porIdioma = (x) => (x && typeof x === "object" ? x[lang] || x.es || "" : x || "");
  const idSeguro = (id) => String(id).replace(/[^A-Za-z0-9_-]/g, "_");

  // Descarga (y recuerda unos minutos) lo que hay de cada río: crecidas históricas, pronóstico del robot (NWS) y pronóstico manual.
  // Los archivos que el índice no menciona no se piden, para no llenar la consola de 404.
  async function cargarRio(e) {
    const p = pais, previo = D.rios[e.id];
    if (previo && Date.now() - previo.t < REFRESCO_MS) return previo;
    const tiene = D.mod[e.id] || [];
    // Los archivos manuales viven en modulos/ (fuera de data/, que la caché de Actions restaura); solo el pronóstico del robot está en data/.
    const manualDe = (nombre) => getJson("modulos/" + p + "/" + encodeURIComponent(e.id) + "/" + nombre).catch(() => null);
    const robotDe = (nombre) => getJson(L.rutaDatos(p, "rios/" + encodeURIComponent(e.id) + "/" + nombre)).catch(() => null);
    const [historicos, manual, nws, situacion, umbrales, ficha] = await Promise.all([
      tiene.includes("historicos") ? manualDe("historicos.json") : null,
      tiene.includes("pronostico_manual") ? manualDe("pronostico_manual.json") : null,
      e.fuente === "usgs" ? robotDe("pronostico.json") : null,
      tiene.includes("situacion") ? manualDe("situacion.json") : null,
      tiene.includes("umbrales") ? manualDe("umbrales.json") : null,
      tiene.includes("ficha") ? manualDe("ficha.json") : null]);
    const r = { t: Date.now(), historicos, nws, manual, situacion, umbrales, ficha };
    if (p === pais) D.rios[e.id] = r;
    return r;
  }

  // El pronóstico que se dibuja: el vigente (NWS antes que el manual); si todos están vencidos, el más reciente, marcado como vencido.
  function elegirPronostico(e) {
    const r = D.rios[e.id];
    if (!r) return null;
    const ok = (d) => d && Array.isArray(d.puntos) && d.puntos.length && (!d.unidad || d.unidad === e.unidad);
    const cands = [r.nws && Object.assign({ manual: false }, r.nws), r.manual && Object.assign({}, r.manual, { manual: true })].filter(ok);
    const vigente = cands.find((d) => !M.pronosticoVencido(d, Date.now()));
    const doc = vigente || cands[0];
    return doc ? { doc, vencido: !vigente } : null;
  }

  // ---------- gráfico de detalle (d3) ----------
  function grafico(el, e) {
    const puntos = L.filtrarRango(D.hist[e.id] || [], Date.now(), RANGOS_H[rango]);
    el.innerHTML = "";
    if (!window.d3 || puntos.length < 2) { el.innerHTML = `<p class="empty">${esc(t().chart_empty)}</p>`; return; }
    const W = Math.max(280, el.clientWidth || 320), H = 180, m = { l: 38, r: 22, t: 10, b: 22 };
    const u = e.umbrales, conU = u && u.tipo !== "en_estudio" && u.bajo != null;
    const pr = elegirPronostico(e);
    const serie = M.serieConPronostico(puntos, pr && pr.doc);
    const obs = serie.filter((d) => d.tipo === "obs"), fut = serie.filter((d) => d.tipo === "prono");
    const ultimo = obs[obs.length - 1];
    const todos = serie.flatMap((d) => (d.v == null ? [d.min, d.max] : [d.v]));
    const rg = L.rangoY(e.unidad || "m3s", todos, conU ? u.bajo : null);
    const x = d3.scaleTime().domain(d3.extent(serie, (d) => d.t)).range([m.l, W - m.r]);
    const y = d3.scaleLinear().domain([rg.min, rg.max]).nice().range([H - m.b, m.t]);
    const svg = d3.select(el).append("svg").attr("class", "ch2").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img")
      .attr("aria-label", t().mod_chart_aria).attr("aria-describedby", "msum-" + idSeguro(e.id));
    svg.append("g").selectAll("line").data(y.ticks(4)).join("line").attr("class", "gr").attr("x1", m.l).attr("x2", W - m.r).attr("y1", (d) => y(d)).attr("y2", (d) => y(d));
    svg.append("g").selectAll("text").data(y.ticks(4)).join("text").attr("x", m.l - 5).attr("y", (d) => y(d) + 3).attr("text-anchor", "end").text((d) => num(d));
    svg.append("g").selectAll("text").data(x.ticks(4)).join("text").attr("x", (d) => x(d)).attr("y", H - 6).attr("text-anchor", "middle")
      .text((d) => d.toLocaleDateString(loc(), { day: "numeric", month: "short", hour: RANGOS_H[rango] <= 48 ? "2-digit" : undefined, timeZone: ZONA_HORARIA[pais] }));
    const c = COL[e.sd ? 4 : e.nivel];
    svg.append("path").datum(obs).attr("fill", c).attr("opacity", 0.13).attr("d", d3.area().x((d) => x(d.t)).y0(H - m.b).y1((d) => y(d.v)));
    svg.append("path").datum(obs).attr("fill", "none").attr("stroke", c).attr("stroke-width", 2).attr("stroke-linejoin", "round").attr("d", d3.line().x((d) => x(d.t)).y((d) => y(d.v)));
    if (conU) ["bajo", "medio", "alto"].forEach((k, i) => {
      if (u[k] > y.domain()[1] || u[k] < y.domain()[0]) return;
      svg.append("line").attr("class", "tl").attr("stroke", COL[i + 1]).attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(u[k])).attr("y2", y(u[k]));
      svg.append("text").attr("x", W - m.r + 3).attr("y", y(u[k]) + 3).text(L.letraUmbral(i, lang));
    });
    if (fut.length && ultimo) {
      const g = svg.append("g").attr("opacity", pr.vencido ? 0.5 : 1);
      const rangos = fut.filter((d) => d.v == null), valores = fut.filter((d) => d.v != null);
      if (rangos.length) {
        const banda = [{ t: ultimo.t, min: ultimo.v, max: ultimo.v }].concat(rangos);
        g.append("path").datum(banda).attr("fill", "var(--accent)").attr("opacity", 0.18).attr("d", d3.area().x((d) => x(d.t)).y0((d) => y(d.min)).y1((d) => y(d.max)));
        [["min"], ["max"]].forEach(([k]) => g.append("path").datum(banda).attr("fill", "none").attr("stroke", "var(--accent)").attr("stroke-width", 1.5).attr("stroke-dasharray", "4 3")
          .attr("d", d3.line().x((d) => x(d.t)).y((d) => y(d[k]))));
      }
      if (valores.length) {
        g.append("path").datum([ultimo].concat(valores)).attr("fill", "none").attr("stroke", "var(--accent)").attr("stroke-width", 2).attr("stroke-dasharray", "5 3")
          .attr("d", d3.line().x((d) => x(d.t)).y((d) => y(d.v)));
      }
    }
    if (ultimo) svg.append("circle").attr("cx", x(ultimo.t)).attr("cy", y(ultimo.v)).attr("r", 3.5).attr("fill", c);
  }

  // Texto que acompaña al gráfico: es también su alternativa textual (el SVG remite a este párrafo).
  function notaGrafico(e) {
    const puntos = L.filtrarRango(D.hist[e.id] || [], Date.now(), RANGOS_H[rango]);
    if (puntos.length < 2) return "";
    const u = e.unidad || "m3s", vs = puntos.map((p) => p[1]);
    const a = new Date(puntos[0][0]), b = new Date(puntos[puntos.length - 1][0]);
    const f = (d) => d.toLocaleDateString(loc(), { day: "numeric", month: "short", timeZone: ZONA_HORARIA[pais] });
    let html = `<p id="msum-${esc(idSeguro(e.id))}">${esc(fmt(t().mod_chart_summary, { desde: f(a), hasta: f(b), min: val(Math.min(...vs), u), max: val(Math.max(...vs), u), ultimo: val(vs[vs.length - 1], u) }))}`;
    const pr = elegirPronostico(e);
    if (!pr) return html + "</p>";
    const d = pr.doc;
    // el gráfico solo dibuja los puntos posteriores a la última lectura; el resumen cuenta lo mismo
    const lecturaFin = Date.parse(puntos[puntos.length - 1][0]);
    const ult = d.puntos.filter((q) => Date.parse(q[0]) > lecturaFin).sort((p, q) => Date.parse(p[0]) - Date.parse(q[0])).pop();
    const fecha = d.manual ? new Date(d.fecha + "T00:00:00Z").toLocaleDateString(loc(), { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }) : hora(d.generado_utc);
    const etiqueta = d.manual ? t().mod_prono_manual : t().mod_prono_nws;
    if (!ult) {
      html += ` ${esc(fmt(t().mod_prono_pasado, { label: etiqueta, fecha }))}</p>`;
      if (pr.vencido) html += `<p><span class="vencido">${esc(t().mod_prono_vencido)}</span></p>`;
      if (d.manual) html += `<p>${esc(fmt(t().mod_prono_manual_nota, { fuente: d.fuente || "—" }))}</p>`;
      return html + `<p>${esc(t().mod_prono_aviso)}</p>`;
    }
    const punto = ult.length >= 3 ? fmt(t().mod_prono_rango, { min: val(ult[1], u), max: val(ult[2], u), dia: dia(ult[0]) }) : fmt(t().mod_prono_punto, { valor: val(ult[1], u), dia: dia(ult[0]) });
    html += ` ${esc(fmt(t().mod_prono_resumen, { label: etiqueta, fecha, punto }))}</p>`;
    html += `<p class="leg"><span style="--c:${colorDe(e)}"><i></i>${esc(t().mod_leyenda_obs)}</span><span style="--c:var(--accent)"><i class="pr"></i>${esc(etiqueta)}</span></p>`;
    if (pr.vencido) html += `<p><span class="vencido">${esc(t().mod_prono_vencido)}</span></p>`;
    if (d.manual) html += `<p>${esc(fmt(t().mod_prono_manual_nota, { fuente: d.fuente || "—" }))}</p>`;
    return html + `<p>${esc(t().mod_prono_aviso)}</p>`;
  }
  const colorDe = (e) => COL[e.sd ? 4 : e.nivel];

  // ---------- simulador ----------
  function simulador(e) {
    const id = idSeguro(e.id), u = e.unidad || "m3s";
    return `<div class="sim"><h4 class="mh">${esc(t().mod_sim_h)}</h4>
      <label for="sim-${esc(id)}">${esc(fmt(t().mod_sim_label, { u: L.unidadTexto(u) }))}</label>
      <input class="simin" id="sim-${esc(id)}" data-id="${esc(e.id)}" type="text" inputmode="decimal" autocomplete="off" aria-describedby="simh-${esc(id)}" value="${esc(D.sim[e.id] || "")}">
      <p class="sdnote" id="simh-${esc(id)}">${esc(t().mod_sim_hint)}</p>
      <div class="simout" id="simo-${esc(id)}" aria-live="polite">${resultadoSim(e)}</div></div>`;
  }
  function resultadoSim(e) {
    const crudo = D.sim[e.id] || "", u = e.unidad || "m3s";
    if (!crudo.trim()) return "";
    const v = M.leerEntrada(crudo);
    if (v == null) return `<p>${esc(t().mod_sim_invalid)}</p>`;
    const s = M.simular(v, e.umbrales), nombre = (n) => { const r = L.nivelRotulo(n, false, lang); return `${r.simbolo} ${r.texto}`; };
    const texto = fmt(t()[s.textoClave], { valor: val(v, u), lv: s.nivel == null ? "" : nombre(s.nivel) });
    if (s.nivel == null) return `<p>${esc(texto)}</p>`;
    const filas = ["N1", "N2", "N3"].map((k, i) => {
      const dist = s.distancias[k], lv = nombre(i + 1);
      if (Math.abs(dist) < 1e-9) return `<li>${esc(fmt(t().mod_sim_justo, { lv }))}</li>`;
      return `<li>${esc(fmt(dist > 0 ? t().mod_sim_falta : t().mod_sim_superado, { lv, d: val(Math.abs(dist), u) }))}</li>`;
    }).join("");
    const actual = e.valor != null && !e.sd ? `<p class="sdnote">${esc(fmt(t().mod_sim_actual, { valor: val(e.valor, u) }))}</p>` : "";
    return `<p>${esc(texto)}</p><ul>${filas}</ul>${actual}`;
  }

  // ---------- crecidas históricas ----------
  function historicas(e, doc) {
    const u = e.unidad || "m3s", ref = e.valor != null && !e.sd ? e.valor : null;
    const comp = M.compararConHistoricas(ref, doc.eventos);
    const etiqueta = (h) => (h.tipo === "defensa" ? t().mod_hist_defensa : h.evento);
    const frase = (h) => (h.diferencia == null ? "" : Math.abs(h.diferencia) < 1e-9 ? t().mod_hist_igual
      : fmt(h.diferencia < 0 ? t().mod_hist_debajo : t().mod_hist_encima, { d: val(Math.abs(h.diferencia), u) }));
    const lista = comp.map((h) => `<li><b>${esc(etiqueta(h))}</b>: ${esc(val(h.valor, u))}${frase(h) ? " · " + esc(frase(h)) : ""}${porIdioma(h.nota) ? `<div class="nota">${esc(porIdioma(h.nota))}</div>` : ""}</li>`).join("");
    return `<h4 class="mh">${esc(t().mod_hist_h)}</h4><p class="sdnote">${esc(t().mod_hist_intro)}</p>${ref == null ? `<p>${esc(t().mod_hist_sin_valor)}</p>` : ""}`
      + `<div class="hbar" data-id="${esc(e.id)}"></div><ul class="hl">${lista}</ul>`
      + (porIdioma(doc.aviso) ? `<p class="sdnote">${esc(porIdioma(doc.aviso))}</p>` : "")
      + `<p class="sdnote">${esc(fmt(t().mod_hist_fuente, { fuente: doc.fuente || "—" }))}</p>`;
  }
  function barrasHistoricas(el, e, doc) {
    if (!window.d3) return;
    const u = e.unidad || "m3s", ref = e.valor != null && !e.sd ? e.valor : null;
    const filas = M.compararConHistoricas(ref, doc.eventos).map((h) => ({ txt: h.tipo === "defensa" ? t().mod_hist_defensa : h.evento, v: h.valor, k: h.tipo }));
    if (ref != null) filas.push({ txt: t().mod_hist_hoy, v: ref, k: "hoy" });
    filas.sort((a, b) => b.v - a.v);
    el.innerHTML = "";
    const W = Math.max(260, el.clientWidth || 320), rh = 22, m = { l: 118, r: 70, t: 4, b: 4 }, H = m.t + m.b + rh * filas.length;
    const x = d3.scaleLinear().domain([0, Math.max(...filas.map((f) => f.v)) * 1.02]).range([m.l, W - m.r]);
    const svg = d3.select(el).append("svg").attr("class", "hb").attr("viewBox", `0 0 ${W} ${H}`).attr("aria-hidden", "true");
    filas.forEach((f, i) => {
      const yy = m.t + i * rh, hoy = f.k === "hoy";
      svg.append("text").attr("x", m.l - 6).attr("y", yy + 15).attr("text-anchor", "end").attr("font-weight", hoy ? 700 : 400).text(f.txt);
      svg.append("rect").attr("x", m.l).attr("y", yy + 3).attr("height", rh - 8).attr("width", Math.max(1, x(f.v) - m.l)).attr("rx", 3)
        .attr("fill", hoy ? "var(--accent)" : f.k === "defensa" ? "none" : "var(--muted)").attr("opacity", hoy ? 1 : f.k === "defensa" ? 1 : 0.55)
        .attr("stroke", f.k === "defensa" ? "var(--muted)" : "none").attr("stroke-width", 1.5).attr("stroke-dasharray", f.k === "defensa" ? "4 3" : null);
      svg.append("text").attr("class", "mu").attr("x", x(f.v) + 5).attr("y", yy + 15).text(val(f.v, u));
    });
  }

  // ---------- ficha especial de una estación ----------
  // El índice de módulos dice qué ficha lleva cada estación (ficha.json). Su script se descarga solo cuando esa estación está abierta.
  const scriptsCargados = {};
  function cargarScript(src) {
    if (!scriptsCargados[src]) scriptsCargados[src] = new Promise((ok, mal) => {
      const s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = () => { delete scriptsCargados[src]; mal(new Error(src)); };
      document.head.appendChild(s);
    });
    return scriptsCargados[src];
  }
  async function montarFicha(el, e) {
    const r = D.rios[e.id], nombre = r && r.ficha ? String(r.ficha.ficha || "") : "";
    if (!/^[a-z]+$/.test(nombre)) { el.hidden = true; return; }
    try { await cargarScript("modulos/ficha_" + nombre + ".js"); } catch (err) { el.hidden = true; return; }
    const F = window["Ficha" + nombre[0].toUpperCase() + nombre.slice(1)];
    if (!F || !el.isConnected) return;
    F.montar(el, { estacion: e, situacion: r.situacion, umbrales: r.umbrales, pronostico: r.manual, lluvia: D.prev, lang, textos: t().ficha_barr });
  }

  // Rellena lo que depende de los archivos del río, cuando ya se descargaron.
  function pintarRio(fila, e) {
    const r = D.rios[e.id] || {};
    const fb = fila.querySelector("[data-ficha]"); if (fb) montarFicha(fb, e);
    const ch = fila.querySelector(".chbox"); if (ch) grafico(ch, e);
    const nota = fila.querySelector(".mnote"); if (nota) nota.innerHTML = notaGrafico(e);
    const h = fila.querySelector('[data-mod="historicas"]');
    if (h && r.historicos && Array.isArray(r.historicos.eventos)) {
      h.innerHTML = historicas(e, r.historicos);
      barrasHistoricas(h.querySelector(".hbar"), e, r.historicos);
    } else if (h) h.hidden = true;
  }

  function modulos(e) {
    if ((D.hist[e.id] || []).length < 2) return "";
    const conHist = (D.mod[e.id] || []).includes("historicos");
    return `<div class="mods"><div class="mnote">${notaGrafico(e)}</div>${simulador(e)}${conHist ? '<div class="mhist" data-mod="historicas"></div>' : ""}</div>`;
  }

  function rellenarDetalle(det) {
    const g = L.agruparPorRio(D.latest.estaciones).find((x) => x.rio === det.dataset.rio);
    if (!g) return;
    const body = det.querySelector(".dbody");
    const botones = t().chart_ranges.map((r, i) => `<button data-r="${i}" aria-pressed="${i === rango}">${esc(r)}</button>`).join("");
    body.innerHTML = `<div class="seg rng" role="group">${botones}</div>` + g.estaciones.map((e) =>
      `<div class="srow"><div class="h"><b>${esc(e.nombre)}</b>${tag(e.nivel, e.sd)}</div>
        <div class="meta"><span>${esc(val(e.valor, e.unidad || "m3s"))}</span><span>${esc(L.edadTexto(L.edadMin(e.t_utc, Date.now()), lang))}</span></div>
        <div class="meta"><span>${esc(umbralesTexto(e.umbrales, e.unidad))}</span><span>${esc(L.tipoUmbralTexto(e.umbrales.tipo, lang))}</span></div>
        ${(D.hist[e.id] || []).length >= 2 ? `<h4 class="mh">${esc(t().mod_chart_h)}</h4>` : ""}<div class="chbox" data-id="${esc(e.id)}"></div>${modulos(e)}${(D.mod[e.id] || []).includes("ficha") ? '<div class="fichab" data-ficha></div>' : ""}</div>`).join("");
    const filas = [...body.querySelectorAll(".srow")];
    g.estaciones.forEach((e, i) => {
      grafico(filas[i].querySelector(".chbox"), e);
      cargarRio(e).then(() => { if (filas[i].isConnected) pintarRio(filas[i], e); });
    });
  }

  // ---------- secciones ----------
  function pintarResumen() {
    const est = D.latest.estaciones, r = L.resumenPorNivel(est);
    document.getElementById("tiles").innerHTML = [3, 2, 1, 0].map((n) => ({ n, c: r.niveles[n], col: COL[n], sd: false }))
      .concat([{ n: 4, c: r.sd, col: COL[4], sd: true }]).map((x) => {
        const rot = x.sd ? L.nivelRotulo(0, true, lang) : L.nivelRotulo(x.n, false, lang);
        return `<div class="tile" style="--c:${x.col}"><div class="k"><span aria-hidden="true">${rot.simbolo}</span> ${esc(rot.texto)}</div><div class="n">${x.c}</div><div class="r">${esc(t().tile_desc[x.n])}</div></div>`;
      }).join("");
  }

  function pintarAvisos() {
    const el = document.getElementById("avisos");
    const hay = !!(D.latest.fuentes_ok && "avisos" in D.latest.fuentes_ok);  // solo España tiene fuente de avisos hoy
    el.hidden = !hay;
    if (!hay) { el.innerHTML = ""; return; }
    const av = (D.latest.avisos || []).slice().sort((a, b) => L.nivelAviso(b.nivel) - L.nivelAviso(a.nivel));
    const item = (a) => {
      const n = L.nivelAviso(a.nivel), rot = L.nivelRotulo(n, false, lang);
      return `<div class="av"><span class="tag" style="--c:${COL[n]}"><span aria-hidden="true">${rot.simbolo}</span> ${esc(a.origen)} · ${esc(t().aviso_color[a.nivel] || a.nivel)}</span>
        <span>${esc(a.descripcion || a.zona)}</span><span class="src">${esc(a.zona)} · ${esc(t().avisos_desde)} ${esc(hora(a.t_utc))}</span></div>`;
    };
    const visibles = av.slice(0, 5), resto = av.slice(5);
    el.innerHTML = `<h2>${esc(t().avisos_title)}</h2>` +
      (av.length ? visibles.map(item).join("") : `<div class="sdnote">${esc(t().avisos_none)}</div>`) +
      (resto.length ? `<details><summary>${esc(t().avisos_more.replace("{n}", resto.length))}</summary>${resto.map(item).join("")}</details>` : "");
  }

  function pintarPrevision() {
    const el = document.getElementById("prev");
    const z = D.prev && D.prev.zonas;
    const claves = z ? Object.keys(t().zonas).filter((k) => z[k] && z[k].length) : [];
    if (!claves.length) { el.innerHTML = `<h2>${esc(t().prev_title)}</h2><div class="sdnote">${esc(t().prev_none)}</div>`; return; }
    const dias = z[claves[0]].map((d) => new Date(d.fecha + "T12:00:00Z").toLocaleDateString(loc(), { weekday: "short", day: "numeric", timeZone: "UTC" }));
    const nivLluvia = (mm) => mm >= 60 ? 3 : mm >= 30 ? 2 : mm >= 10 ? 1 : 0;
    el.innerHTML = `<h2>${esc(t().prev_title)}</h2><div class="pwrap"><table class="ptab"><thead><tr><th></th>${dias.map((d) => `<th>${esc(d)}</th>`).join("")}</tr></thead><tbody>` +
      claves.map((k) => `<tr><td class="z">${esc(t().zonas[k])}</td>${z[k].map((d) => `<td class="c" style="--c:${nivLluvia(d.mm) ? COL[nivLluvia(d.mm)] : "var(--line)"}"><b>${val(d.mm, "mm")}</b><small>${d.prob} %</small></td>`).join("")}</tr>`).join("") +
      `</tbody></table></div><p class="pnote">${esc(tp().prev_note)}</p>`;
  }

  function pintarBanners() {
    const b = [];
    if (desconocido) b.push(`<div class="banner">${esc(t().pais_desconocido.replace("{pais}", t().paises[pais].nombre))}</div>`);
    if (D.error) b.push(`<div class="banner err">${esc(t().error_load)}</div>`);
    if (D.latest) {
      if (L.datosViejos(D.latest.generado_utc, Date.now())) {
        const min = D.latest.generado_utc ? (Date.now() - Date.parse(D.latest.generado_utc)) / 60000 : null;
        const edad = min == null ? "—" : L.duracionTexto(min);
        b.push(`<div class="banner">${esc(t().banner_stale.replace("{edad}", edad))}</div>`);
      }
      const caidas = Object.keys(D.latest.fuentes_ok || {}).filter((k) => D.latest.fuentes_ok[k] === false).map((k) => t().fuentes_nombres[k] || k);
      if (caidas.length) b.push(`<div class="banner">${esc(t().banner_fuentes.replace("{lista}", caidas.join(", ")))}</div>`);
    }
    document.getElementById("banners").innerHTML = b.join("");
  }

  function pintarTarjetas() {
    const grid = document.getElementById("grid");
    if (!D.latest) { grid.innerHTML = `<p class="empty">${esc(D.sinDatos ? t().pais_sin_datos : D.error ? t().error_load : t().loading)}</p>`; return; }
    const abiertos = new Set([...grid.querySelectorAll("details.det[open]")].map((d) => d.dataset.rio));
    // si se está escribiendo en un simulador, el repintado periódico no debe quitarle el foco
    const foco = document.activeElement && document.activeElement.classList.contains("simin") ? { id: document.activeElement.dataset.id, ini: document.activeElement.selectionStart } : null;
    let grupos = L.agruparPorRio(D.latest.estaciones);
    if (filtro === "act") grupos = grupos.filter((g) => g.principal.nivel >= 1);
    grid.innerHTML = grupos.length ? grupos.map(tarjeta).join("") : `<p class="empty">${esc(t().filt_none)}</p>`;
    grid.querySelectorAll("details.det").forEach((d) => { if (abiertos.has(d.dataset.rio)) { d.open = true; rellenarDetalle(d); } });
    if (foco) {
      const inp = [...grid.querySelectorAll(".simin")].find((x) => x.dataset.id === foco.id);
      if (inp) { inp.focus(); try { inp.setSelectionRange(foco.ini, foco.ini); } catch (err) { /* sin selección: no pasa nada */ } }
    }
  }

  // Cada pestaña lleva el nombre del país y, si hay estaciones en alerta, el símbolo del nivel más alto con su cuenta.
  function pintarPestanas() {
    document.getElementById("tabs").setAttribute("aria-label", t().tab_label);
    document.querySelectorAll("#tabs button").forEach((b) => {
      const p = b.dataset.p, sel = p === pais;
      const r = L.resumenPais(D.indice && D.indice[p]);
      const alto = r.porNivel.reduce((m, c, n) => (c > 0 && n > 0 ? n : m), 0);
      const enAlerta = r.porNivel[1] + r.porNivel[2] + r.porNivel[3];
      const rot = L.nivelRotulo(alto, false, lang);
      b.setAttribute("aria-selected", String(sel));
      b.tabIndex = sel ? 0 : -1;
      b.innerHTML = esc(t().paises[p].nombre) + (alto ? ` <span class="badge" style="--c:${COL[alto]}" title="${esc(rot.texto)}"><span aria-hidden="true">${rot.simbolo}</span> ${enAlerta}<span class="sr"> ${esc(rot.texto)}</span></span>` : "");
    });
    document.getElementById("panel").setAttribute("aria-labelledby", "tab-" + pais);
  }

  function irAPais(p, dejarHash) {
    if (p === pais && !dejarHash) return;
    pais = p; desconocido = false;
    vaciarPais();
    render();
    cargar();
  }

  function render() {
    const x = t();
    document.documentElement.lang = lang;
    document.getElementById("t-title").textContent = tp().titulo;
    document.getElementById("t-sub").textContent = tp().sub;
    document.title = tp().titulo + " · " + x.title;
    pintarPestanas();
    document.getElementById("t-est").textContent = x.est_title;
    const fb = document.querySelectorAll("#filt button");
    fb[0].textContent = x.filt_all; fb[1].textContent = x.filt_act;
    fb.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filtro)));
    document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
    document.getElementById("foot").innerHTML = tp().foot.concat(x.foot).map((p) => `<p>${p}</p>`).join("");
    pintarBanners();
    if (D.latest) { pintarResumen(); pintarAvisos(); pintarPrevision(); document.getElementById("prev").hidden = false; }
    else {
      document.getElementById("tiles").innerHTML = ""; document.getElementById("avisos").innerHTML = ""; document.getElementById("prev").innerHTML = "";
      document.getElementById("avisos").hidden = true; document.getElementById("prev").hidden = true;
    }
    pintarTarjetas();
  }

  // ---------- eventos ----------
  document.getElementById("lang").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    lang = b.dataset.l;
    try { localStorage.setItem("lang", lang); } catch (err) { /* sin almacenamiento: no pasa nada */ }
    render();
  });
  document.getElementById("filt").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { filtro = b.dataset.f; render(); } });
  document.getElementById("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-p]"); if (!b) return;
    if (location.hash === L.hashPara(b.dataset.p)) irAPais(b.dataset.p); else location.hash = L.hashPara(b.dataset.p);
  });
  document.getElementById("tabs").addEventListener("keydown", (e) => {
    const orden = L.PAISES, i = orden.indexOf(pais);
    const j = e.key === "ArrowRight" ? (i + 1) % orden.length : e.key === "ArrowLeft" ? (i + orden.length - 1) % orden.length
      : e.key === "Home" ? 0 : e.key === "End" ? orden.length - 1 : -1;
    if (j < 0) return;
    e.preventDefault();
    location.hash = L.hashPara(orden[j]);
    document.getElementById("tab-" + orden[j]).focus();
  });
  window.addEventListener("hashchange", () => {
    const p = L.paisDesdeHash(location.hash, pais);
    desconocido = !!location.hash.replace("#", "") && !L.PAISES.includes(location.hash.replace("#", "").toLowerCase());
    if (p !== pais) irAPais(p); else render();
  });
  document.getElementById("grid").addEventListener("toggle", (e) => { if (e.target.matches && e.target.matches("details.det") && e.target.open) rellenarDetalle(e.target); }, true);
  document.getElementById("grid").addEventListener("input", (ev) => {
    const inp = ev.target.closest && ev.target.closest(".simin"); if (!inp) return;
    const est = D.latest && D.latest.estaciones.find((x) => x.id === inp.dataset.id); if (!est) return;
    D.sim[est.id] = inp.value;
    inp.closest(".sim").querySelector(".simout").innerHTML = resultadoSim(est);
  });
  document.getElementById("grid").addEventListener("click", (e) => {
    const b = e.target.closest(".rng button"); if (!b) return;
    rango = +b.dataset.r;
    const det = b.closest("details.det"); if (det) rellenarDetalle(det);
  });

  let guardado = null;
  try { guardado = localStorage.getItem("lang"); } catch (err) { /* idem */ }
  lang = L.idiomaInicial(location.search, guardado, navigator.language);
  const crudo = location.hash.replace("#", "").toLowerCase();
  pais = L.paisDesdeHash(location.hash, L.paisPorIdioma(navigator.language));
  desconocido = !!crudo && !L.PAISES.includes(crudo);
  render();
  cargar();
  setInterval(cargar, REFRESCO_MS);
})();
</script>
</body>
</html>
