/* Diseño base de Pablo Dodda (nivelrio): variables de color, tipografía de sistema, tarjetas y escalas. */
:root {
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: Georgia, "Times New Roman", serif;
  --fs-cap: 12px; --fs-body: 14px; --fs-head: 16px; --fs-title: 30px;
  --gap-xs: 4px; --gap-sm: 8px; --gap-md: 14px; --gap-lg: 22px;
  --radius: 10px;
  --bg: #f7f6f2; --panel: #ffffff; --fg: #1f1e1b; --muted: #6b6860; --line: #e3e0d8; --grid: #ece9e1;
  --n0: #2e7d4f; --n1: #a07d0a; --n2: #c46a12; --n3: #c0392b; --sd: #8a867c;
  --accent: #2f6fd0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191917; --panel: #23221f; --fg: #ecebe6; --muted: #a3a097; --line: #3a3833; --grid: #302f2b;
    --n0: #5fbf85; --n1: #e0c04a; --n2: #f0a04b; --n3: #ef6f61; --sd: #8f8b81; --accent: #6ea3ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191917; --panel: #23221f; --fg: #ecebe6; --muted: #a3a097; --line: #3a3833; --grid: #302f2b;
  --n0: #5fbf85; --n1: #e0c04a; --n2: #f0a04b; --n3: #ef6f61; --sd: #8f8b81; --accent: #6ea3ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: var(--fs-body);
  padding-block: 20px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin-inline: auto; display: grid; gap: var(--gap-lg); }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--gap-md); align-items: flex-start; }
.top > div { min-width: 0; }
h1 { font-family: var(--font-serif); font-weight: 400; font-size: var(--fs-title); line-height: 1.15; margin: 0 0 var(--gap-xs); text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 46rem; line-height: 1.5; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.seg button { background: transparent; color: var(--muted); border: 0; padding: 7px 12px; font: inherit; font-size: var(--fs-cap); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 600; }
.tabs { display: flex; gap: var(--gap-xs); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 9px 14px;
  font: inherit; font-size: var(--fs-head); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 8px; align-items: baseline; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }
.tabs button:hover { color: var(--fg); }
.tabs .badge { font-size: var(--fs-cap); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--c); }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.banner { border: 1px solid var(--n2); color: var(--fg); background: var(--panel); border-left: 4px solid var(--n2); border-radius: var(--radius); padding: 10px 14px; line-height: 1.45; }
.banner.err { border-color: var(--n3); border-left-color: var(--n3); }
.banners { display: grid; gap: var(--gap-sm); }
.banners:empty { display: none; }
.tiles { display: grid; gap: var(--gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; border-top: 3px solid var(--c); }
.tile .k { font-size: var(--fs-cap); color: var(--muted); }
.tile .n { font-family: var(--font-serif); font-size: var(--fs-title); line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .r { font-size: var(--fs-cap); color: var(--muted); margin-top: 2px; min-height: 1.4em; }
.avisos, .prev { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; }
.avisos h2, .sec h2, .prev h2 { font-size: var(--fs-head); font-weight: 600; margin: 0; }
.av { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.av .src { font-size: var(--fs-cap); color: var(--muted); }
.avisos details summary { cursor: pointer; color: var(--muted); font-size: var(--fs-cap); }
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: var(--fs-cap); border: 1px solid currentColor; color: var(--c); white-space: nowrap; font-weight: 600; }
.bar { display: flex; flex-wrap: wrap; gap: var(--gap-md); justify-content: space-between; align-items: center; }
.grid { display: grid; gap: var(--gap-md); grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; display: grid; gap: 10px; align-content: start; border-top: 3px solid var(--c); }
.card.n0 { border-top-color: var(--line); }
.ch { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ch > div { min-width: 0; }
.tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.rio { font-size: var(--fs-cap); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.est { font-size: var(--fs-head); font-weight: 600; margin-top: 1px; overflow-wrap: anywhere; }
.val { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big { font-family: var(--font-serif); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big small { font-family: var(--font-sans); font-size: var(--fs-body); color: var(--muted); }
.tr { font-size: var(--fs-cap); font-variant-numeric: tabular-nums; color: var(--muted); }
.tr.up { color: var(--n2); font-weight: 600; }
svg.sp { width: 100%; height: auto; display: block; }
.sp .gr, .ch2 .gr { stroke: var(--grid); stroke-width: 1; }
.sp .tl, .ch2 .tl { stroke-width: 1; stroke-dasharray: 4 3; }
.sp .lb, .sp .ax, .ch2 text { font-size: 10px; fill: var(--muted); }
.lad { display: flex; gap: 2px; height: 8px; }
.lad i { flex: 1; background: var(--grid); border-radius: 2px; }
.lad i.on { background: var(--c); }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: var(--fs-cap); color: var(--muted); line-height: 1.4; }
.sdnote { font-size: var(--fs-cap); color: var(--muted); }
.foot { color: var(--muted); font-size: var(--fs-cap); line-height: 1.6; border-top: 1px solid var(--line); padding-top: var(--gap-md); }
.foot p { margin: 0 0 var(--gap-xs); max-width: 56rem; }
.foot b { color: var(--fg); }
.ptab { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-variant-numeric: tabular-nums; }
.ptab th { font-size: var(--fs-cap); font-weight: 400; color: var(--muted); text-align: center; padding: 0 6px 2px; }
.ptab td { padding: 7px 8px; background: var(--bg); }
.ptab td.z { border-radius: 8px 0 0 8px; font-weight: 600; min-width: 9rem; }
.ptab td:last-child { border-radius: 0 8px 8px 0; }
.ptab td.c { text-align: center; border-left: 3px solid var(--c); white-space: nowrap; }
.ptab td.c b { font-weight: 600; }
.ptab td.c small { color: var(--muted); font-size: 11px; margin-left: 4px; }
.pwrap { overflow-x: auto; }
.pnote { font-size: var(--fs-cap); color: var(--muted); line-height: 1.5; margin: 0; max-width: 56rem; }
.fc { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.fc .fh { font-size: var(--fs-cap); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fc .fl { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.fc .fl b { font-weight: 600; }
.fc .fchip { justify-self: start; }
details.det { border-top: 1px solid var(--line); padding-top: 8px; }
details.det > summary { cursor: pointer; font-size: var(--fs-cap); color: var(--muted); }
.srow { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.srow .h b { font-weight: 600; overflow-wrap: anywhere; }
.chbox { min-height: 170px; }
.ch2 { width: 100%; height: auto; display: block; }
.rng { justify-self: start; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.empty { color: var(--muted); font-size: var(--fs-cap); padding: 8px 0; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .3s; } }
</style>
</head>

s: Sebastian Andrada. Llicència MIT."],"aviso_color":{"amarillo":"groc","naranja":"taronja","rojo":"vermell"},"last_level":"Darrer nivell conegut","ago_updated":"Actualitzat","noscript":"Aquesta pàgina necessita JavaScript per mostrar les dades.","details_show":"Veure estacions i historial","title":"Nivell dels rius","desc":"Nivell i cabal de rius amb risc de crescuda a l'Argentina, Espanya i els Estats Units. Dades d'organismes públics, amb una escala d'alerta pròpia, actualitzades cada hora o abans si canvia un nivell.","tab_label":"País","pais_sin_datos":"Encara no hi ha dades d'aquest país. Apareixeran quan es completi la primera lectura.","pais_desconocido":"Aquest país no existeix a l'adreça. Es mostra {pais}.","paises":{"ar":{"nombre":"Argentina","titulo":"Rius del litoral argentí","desc":"Alçada del Paraná i de l'Uruguai al litoral argentí. Lectures de l'INA i de l'Administración General de Puertos, actualitzades en aquesta pàgina cada hora.","sub":"Alçada del Paraná i de l'Uruguai al litoral argentí, en metres. L'INA publica un valor per dia; el port de Barranqueras, un per hora.","prev_note":"Pluja acumulada per dia (mm) i probabilitat màxima, el valor més alt entre les estacions de cada zona. Font: Open-Meteo.com (CC BY 4.0). Aquesta pàgina no mostra cap previsió d'alçada del riu. La previsió mai no canvia el nivell d'alerta.","foot":["<b>Informatiu.<\/b> Dades provisionals sense validar. No substitueix Defensa Civil ni els avisos de la vostra província. Seguiu sempre les seves instruccions. En una emergència truqueu al 911.","<b>Límits.<\/b> L'INA actualitza un valor per dia, de manera que una crescuda ràpida pot trigar a veure's. Només es mostren algunes estacions del Paraná i de l'Uruguai. Els rius sense llindar només mostren l'alçada.","Fonts: Instituto Nacional del Agua (INA), Administración General de Puertos (AGP) i Open-Meteo.com (CC BY 4.0). Alerta i evacuació són els nivells que publica l'INA; Vigilància és una regla pròpia d'aquesta pàgina (90 % del nivell d'alerta) i no és oficial. A Barranqueras s'usen els nivells d'avís de l'Administración Provincial del Agua del Chaco."]},"es":{"nombre":"Espanya","titulo":"Rius de Catalunya","desc":"Cabal dels rius de Catalunya amb més risc d'inundació, amb context de València (Túria, Xúquer, Poyo). Lectures de l'ACA i la CHJ, actualitzades cada hora o abans si canvia un nivell.","sub":"Cabal dels rius de Catalunya amb més risc d'inundació, més context de València. S'actualitza cada hora, o abans si canvia un nivell.","prev_note":"Pluja acumulada per dia (mm) i probabilitat màxima, el valor més alt entre les estacions de cada zona. Font: Open-Meteo.com (CC BY 4.0). No hi ha cap previsió oficial de cabals per a aquests rius: el cabal esperat de cada targeta surt d'un model global (GloFAS, malla d'uns 5 km, una dada per dia). Serveix d'orientació i no capta les crescudes ràpides de riera. La previsió mai no canvia el nivell d'alerta.","foot":["<b>Informatiu.<\/b> Dades provisionals sense validar. No substitueix Protecció Civil. Seguiu sempre les seves instruccions. En una emergència truqueu al 112.","<b>Límits.<\/b> Les conques ràpides com la rambla del Poyo poden créixer en menys d'una hora, més de pressa que aquesta pàgina. Segre, Ebre i Noguera encara no tenen estació a la pàgina perquè falta una font de dades fiable. Els rius sense llindar només mostren el cabal.","Fonts: Agència Catalana de l'Aigua (ACA), Confederación Hidrográfica del Júcar (SAIH), AEMET, Protecció Civil de Catalunya (INUNCAT) i Open-Meteo.com (CC BY 4.0). Els nivells Vigilància, Avís i Perill són una escala pròpia d'aquesta pàgina, no una escala oficial. Els llindars de Catalunya són estimacions calculades a partir de la sèrie històrica; els de València són els oficials de la CHJ."]},"us":{"nombre":"EUA","titulo":"Rius del centre dels Estats Units","desc":"Alçada dels rius Mississippi, Missouri, Ohio i Red River of the North. Lectures de l'USGS, actualitzades en aquesta pàgina cada hora.","sub":"Alçada dels rius Mississippi, Missouri, Ohio i Red River of the North, en peus, tal com la publica l'USGS.","prev_note":"Pluja acumulada per dia (mm) i probabilitat màxima, el valor més alt entre les estacions de cada zona. Font: Open-Meteo.com (CC BY 4.0). Aquesta pàgina encara no mostra el pronòstic de riu del Servei Meteorològic Nacional (NWS). La previsió mai no canvia el nivell d'alerta.","foot":["<b>Informatiu.<\/b> Dades provisionals sense validar. No substitueix el Servei Meteorològic Nacional (NWS) ni les autoritats locals d'emergències. Seguiu sempre les seves instruccions. En una emergència truqueu al 911.","<b>Límits.<\/b> Només es mostren algunes estacions. Una crescuda en un afluent petit pot no veure's aquí. Els nivells es veuen en peus, com els publica la font, sense convertir.","Fonts: U.S. Geological Survey (USGS), National Weather Service (NWS) i Open-Meteo.com (CC BY 4.0). Els nivells Vigilància, Avís i Perill són una escala pròpia d'aquesta pàgina, no una escala oficial. Quan el NWS publica categories d'inundació per a l'estació (acció, menor, moderada), s'usen com a llindars; si no, l'estació mostra només l'alçada."]}}},"en":{"lang_label":"Language","tile_desc":["below threshold","high flow","major rise","flood risk","reading old or missing"],"avisos_title":"Official warnings in effect","avisos_none":"No official rain or flood warnings in effect.","avisos_more":"and {n} more warnings","avisos_desde":"since","prev_title":"Rain forecast, next 3 days","prev_none":"The rain forecast isn't available right now.","zonas":{"tarragona":"Tarragona and the south coast","barcelona":"Barcelona and Maresme","girona":"Girona and Empordà","interior":"Inland (Lleida, Cardener)","valencia":"Valencia (Turia, Júcar, Poyo)","chaco-corrientes":"Chaco and Corrientes","litoral-parana":"Litoral: Santa Fe, Paraná and Rosario","uruguay":"Uruguay River (Concordia)","mississippi":"Mississippi (St. Louis)","missouri-ohio":"Missouri and Ohio (Kansas City, Cincinnati)","red-river":"Red River of the North (Fargo)"},"est_title":"Rivers, from highest to lowest risk","filt_all":"All","filt_act":"Alerts only","filt_none":"No river is on alert right now.","rise":"rising","fall":"falling","flat":"steady","no_value":"No reading","sd_note":"No recent data. The last known level is kept.","forecast_h":"72 h forecast","rain48":"Rain, 48 h","fcq":"Expected flow","fcwarn":"rough guide","fcmay":"Could reach","fcnone":"No reliable flow forecast for this point.","thr_legend":"W Watch · A Alert · D Danger","thr_none":"Thresholds are still under review, so only the reading is shown for now.","source":"Source","stations_of":"Stations on this river","chart_title":"History","chart_ranges":["48 h","15 days","3 months"],"chart_empty":"Collecting history. The chart fills in as the hours pass.","chart_aria":"Station flow over time, with the threshold lines","trend_prefix":"Trend","banner_stale":"The data hasn't updated in {edad}. What you see may not be the current state.","banner_fuentes":"Couldn't read: {lista}. Those stations show as no data.","fuentes_nombres":{"aca":"ACA (Catalonia)","chj":"CHJ (Valencia)","avisos":"official warnings","prevision":"forecast","ina":"INA (Argentina)","agp":"AGP (Barranqueras port)","usgs":"USGS (US)"},"loading":"Loading data…","error_load":"Couldn't load the data. Trying again in a few minutes.","foot":["Built by Pablo Dodda. Adapted for Catalonia and more countries by Sebastian Andrada. MIT license."],"aviso_color":{"amarillo":"yellow","naranja":"orange","rojo":"red"},"last_level":"Last known level","ago_updated":"Updated","noscript":"This page needs JavaScript to show the data.","details_show":"Show stations and history","title":"River levels","desc":"Level and flow of flood-prone rivers in Argentina, Spain and the United States. Data from public agencies, with this page's own alert scale, refreshed every hour or sooner if a level changes.","tab_label":"Country","pais_sin_datos":"There's no data for this country yet. It will alue among the stations in each zone. Source: Open-Meteo.com (CC BY 4.0). There is no official flow forecast for these rivers: the expected flow on each card comes from a global model (GloFAS, roughly 5 km grid, one value per day). Treat it as a rough guide; it misses flash floods in ramblas. The forecast never changes the alert level.","foot":["<b>For information only.<\/b> Provisional, unvalidated data. It does not replace Protecció Civil. Follow their instructions at all times. In an emergency call 112.","<b>Limits.<\/b> Flash-flood basins like the Rambla del Poyo can rise in under an hour, faster than this page updates. Segre, Ebre and Noguera have no station here yet because a reliable data source is missing. Rivers without a threshold show flow only.","Sources: Agència Catalana de l'Aigua (ACA), Confederación Hidrográfica del Júcar (SAIH), AEMET, Protecció Civil de Catalunya (INUNCAT) and Open-Meteo.com (CC BY 4.0). The Watch, Alert and Danger levels are this page's own scale, not an official one. Catalonia's thresholds are estimates calculated from the historical record; Valencia's are the official CHJ ones."]},"us":{"nombre":"US","titulo":"Rivers of the central United States","desc":"Heights of the Mississippi, Missouri, Ohio and Red River of the North. USGS readings, refreshed on this page every hour.","sub":"Heights of the Mississippi, Missouri, Ohio and Red River of the North, in feet, as USGS publishes them.","prev_note":"Rain accumulated per day (mm) and peak probability, taking the highest value among the stations in each zone. Source: Open-Meteo.com (CC BY 4.0). This page doesn't show the National Weather Service (NWS) river forecast yet. The forecast never changes the alert level.","foot":["<b>For information only.<\/b> Provisional, unvalidated data. It does not replace the National Weather Service (NWS) or your local emergency management office. Follow their instructions at all times. In an emergency call 911.","<b>Limits.<\/b> Only some stations are shown. A rise on a small tributary may not show up here. Levels are shown in feet, as the source publishes them, with no conversion.","Sources: U.S. Geological Survey (USGS), National Weather Service (NWS) and Open-Meteo.com (CC BY 4.0). The Watch, Alert and Danger levels are this page's own scale, not an official one. When the NWS publishes flood categories for a gauge (action, minor, moderate), they are used as thresholds; otherwise the station shows the stage only."]}}}}</script>

<script>
/* Lógica pura de la página (sin DOM). Se prueba con `node --test tests/web/` y se incrusta en index.html. */
(function (root, factory) {
  const L = factory();
  if (typeof module === "object" && module.exports) module.exports = L;
  else root.Logica = L;
})(typeof self !== "undefined" ? self : this, function () {
  const ROTULOS = {
    es: ["Normal", "Vigilancia", "Aviso", "Peligro"],
    ca: ["Normal", "Vigilància", "Avís", "Perill"],
    en: ["Normal", "Watch", "Alert", "Danger"],
  };
  const SIN_DATOS = { es: "Sin datos", ca: "Sense dades", en: "No data" };
  // Inicial de cada umbral (el 1.º, 2.º y 3.º) en los rótulos de las gráficas y de las tarjetas.
  const LETRAS_UMBRAL = { es: "VAP", ca: "VAP", en: "WAD" };
  const IDIOMAS = ["es", "ca", "en"];
  const LOCALES = { es: "es-ES", ca: "ca-ES", en: "en-US" };
  // Símbolos distintos por nivel: el nivel nunca se comunica solo con color.
  const SIMBOLOS = ["●", "◆", "▲", "■"];
  const SIMBOLO_SD = "○";
  const UMBRAL_TEXTO = {
    es: { oficial: "oficial", estimado: "estimado, no oficial", en_estudio: "umbral en estudio" },
    ca: { oficial: "oficial", estimado: "estimat, no oficial", en_estudio: "llindar en estudi" },
    en: { oficial: "official", estimado: "estimated, unofficial", en_estudio: "threshold under review" },
  };
  const LIMITE_DATOS_VIEJOS_MIN = 90;

  const idioma = (lang) => (IDIOMAS.includes(lang) ? lang : "es");
  const localeDe = (lang) => LOCALES[idioma(lang)];

  // Duración sin prefijo ni sufijo: «3 h 10 min».
  function duracionTexto(minutos) {
    if (minutos === null || minutos === undefined || Number.isNaN(minutos)) return "—";
    const m = Math.max(0, Math.round(minutos));
    if (m >= 1440) return `${Math.floor(m / 1440)} d`;
    if (m >= 60) {
      const h = Math.floor(m / 60), r = m % 60;
      return r ? `${h} h ${r} min` : `${h} h`;
    }
    return `${m} min`;
  }

  function edadTexto(minutos, lang) {
    const d = duracionTexto(minutos);
    if (d === "—") return d;
    if (lang === "en") return `${d} ago`;
    return `${lang === "ca" ? "fa" : "hace"} ${d}`;
  }

  function nivelRotulo(nivel, sd, lang) {
    const l = idioma(lang);
    if (sd) return { texto: SIN_DATOS[l], simbolo: SIMBOLO_SD };
    return { texto: ROTULOS[l][nivel], simbolo: SIMBOLOS[nivel] };
  }

  function tipoUmbralTexto(tipo, lang) {
    return (UMBRAL_TEXTO[idioma(lang)] || {})[tipo] || "";
  }

  // La URL manda; después lo guardado; después el idioma del navegador (solo en* → en); por defecto castellano.
  function idiomaInicial(search, guardado, navegador) {
    const m = /[?&]lang=(es|ca|en)(?:&|$)/.exec(search || "");
    if (m) return m[1];
    if (IDIOMAS.includes(guardado)) return guardado;
    return /^en(?:[-_]|$)/i.test(String(navegador || "")) ? "en" : "es";
  }

  function letraUmbral(i, lang) { return LETRAS_UMBRAL[idioma(lang)][i] || ""; }

  function ratio(e) {
    const b = e.umbrales && e.umbrales.bajo;
    return b > 0 && typeof e.valor === "number" ? e.valor / b : -1;
  }

  function ordenarPorPeligro(estaciones) {
    return estaciones.slice().sort((a, b) =>
      b.nivel - a.nivel || Number(a.sd) - Number(b.sd) || String(a.rio).localeCompare(String(b.rio), "es"));
  }

  function resumenPorNivel(estaciones) {
    const niveles = [0, 0, 0, 0];
    let sd = 0;
    estaciones.forEach((e) => { niveles[e.nivel]++; if (e.sd) sd++; });
    return { niveles, sd };
  }

  // Una entrada por río. La estación principal es la de mayor nivel; a igual nivel, la que tiene dato
  // y está más cerca de su umbral; si no hay umbrales, la primera de la lista.
  function agruparPorRio(estaciones) {
    const orden = new Map();
    estaciones.forEach((e, i) => orden.set(e, i));
    const cmp = (a, b) =>
      b.nivel - a.nivel || Number(a.sd) - Number(b.sd) || ratio(b) - ratio(a) || orden.get(a) - orden.get(b);
    const por = new Map();
    estaciones.forEach((e) => { if (!por.has(e.rio)) por.set(e.rio, []); por.get(e.rio).push(e); });
    const grupos = [...por.entries()].map(([rio, lista]) => {
      const ord = lista.slice().sort(cmp);
      return { rio, estaciones: ord, principal: ord[0] };
    });
    return grupos.sort((x, y) => cmp(x.principal, y.principal));
  }

  // puntos: [[iso, valor], ...] en orden temporal. Compara el último con el de ~1 h antes.
  function tendencia(puntos) {
    if (!puntos || puntos.length < 2) return null;
    const ult = puntos[puntos.length - 1];
    const tUlt = Date.parse(ult[0]);
    let ref = null;
    for (let i = puntos.length - 2; i >= 0; i--) {
      if (tUlt - Date.parse(puntos[i][0]) >= 50 * 60000) { ref = puntos[i]; break; }
    }
    if (!ref) return null;
    const delta = ult[1] - ref[1];
    if (Math.abs(delta) <= 0.1 * Math.max(ref[1], 0.01)) return "estable";
    return delta > 0 ? "sube" : "baja";
  }

  function filtrarRango(puntos, ahoraMs, horas) {
    const desde = ahoraMs - horas * 3600000;
    return puntos.filter((p) => Date.parse(p[0]) >= desde);
  }

  function nivelAviso(color) {
    return { amarillo: 1, naranja: 2, rojo: 3 }[color] || 0;
  }

  function datosViejos(generadoIso, ahoraMs) {
    if (!generadoIso) return true;
    return (ahoraMs - Date.parse(generadoIso)) / 60000 > LIMITE_DATOS_VIEJOS_MIN;
  }

  // La edad se calcula en el navegador: «edad_min» del JSON queda congelada en el momento de generarlo.
  function edadMin(iso, ahoraMs) {
    if (!iso) return null;
    return Math.max(0, Math.floor((ahoraMs - Date.parse(iso)) / 60000));
  }

  // Añade la lectura actual al historial horario: el historial guarda un punto por hora (el pico) y
  // compararlo con el valor actual evita que un pico de hace 50 min haga parecer que el río «baja».
  function serieConActual(hist, tIso, valor) {
    if (valor == null) return hist;
    return hist.concat([[tIso, valor]]);
  }

  // ---------- países ----------
  const PAISES = ["ar", "es", "us"];
  const POR_NIVEL_VACIO = () => [0, 0, 0, 0];

  function paisDesdeHash(hash, porDefecto) {
    const p = String(hash || "").replace(/^#/, "").toLowerCase();
    return PAISES.includes(p) ? p : porDefecto;
  }

  function hashPara(pais) { return "#" + pais; }

  function rutaDatos(pais, archivo) { return "data/" + pais + "/" + archivo; }

  // País inicial según el idioma del navegador: ca y es-ES → es, es-AR → ar, en-US → us; el resto, es.
  function paisPorIdioma(idioma) {
    const l = String(idioma || "").toLowerCase().replace("_", "-");
    if (l === "es-ar") return "ar";
    if (l === "en-us") return "us";
    return "es";
  }

  // Una entrada de data/paises.json: {estaciones: N, por_nivel: [n0..n3], sd, ...}. Sin entrada, todo a cero.
  function resumenPais(entrada) {
    const e = entrada || {};
    const porNivel = POR_NIVEL_VACIO();
    (Array.isArray(e.por_nivel) ? e.por_nivel : []).slice(0, 4).forEach((v, i) => { porNivel[i] = Number(v) || 0; });
    return { n: Number(e.estaciones) || 0, porNivel, sd: Number(e.sd) || 0 };
  }

  // La unidad se muestra como la publica la fuente: metros en Argentina, pies en EE. UU., sin convertir.
  const UNIDADES = { m3s: "m³/s", m: "m", ft: "ft", mm: "mm" };
  function unidadTexto(unidad) { return UNIDADES[unidad] || ""; }

  // Número con los separadores del idioma y los decimales que caben según su tamaño.
  function formatoNumero(valor, lang) {
    if (valor === null || valor === undefined || Number.isNaN(valor)) return "—";
    const v = Math.abs(valor);
    return new Intl.NumberFormat(localeDe(lang), { maximumFractionDigits: v >= 100 ? 0 : v >= 10 ? 1 : 2 }).format(valor);
  }

  // Único punto de formato de una medida: «6,1 m», «28 ft», «41,2 m³/s». Nunca convierte de unidad.
  function formatoValor(valor, unidad, lang) {
    const n = formatoNumero(valor, lang);
    const u = unidadTexto(unidad);
    return n === "—" || !u ? n : `${n} ${u}`;
  }

  // Rango vertical de los gráficos. El caudal parte de cero; una altura de río se ajusta a sus datos,
  // porque con un 0 de base una variación de decímetros se vería como una línea recta.
  function rangoY(unidad, valores, umbralBajo) {
    const vs = valores.filter((v) => typeof v === "number");
    const hi = Math.max(...vs, 0.5);
    if (unidad === "m3s" || !vs.length) {
      return { min: 0, max: Math.max(hi * 1.08, umbralBajo ? umbralBajo * 1.35 : 0, 0.5) };
    }
    const lo = Math.min(...vs, umbralBajo == null ? Infinity : umbralBajo);
    const tope = Math.max(hi, umbralBajo == null ? -Infinity : umbralBajo * 1.05);
    const hueco = Math.max((tope - lo) * 0.15, 0.1);
    return { min: lo - hueco, max: tope + hueco };
  }

  return { PAISES, paisDesdeHash, hashPara, rutaDatos, paisPorIdioma, resumenPais, unidadTexto, formatoNumero, formatoValor, duracionTexto, letraUmbral, localeDe, rangoY, edadMin, serieConActual, edadTexto, nivelRotulo, tipoUmbralTexto, idiomaInicial, ordenarPorPeligro, resumenPorNivel,
    agruparPorRio, tendencia, filtrarRango, nivelAviso, datosViejos };
});

</script>
<script>
(function () {
  "use strict";
  const L = window.Logica;
  const T = JSON.parse(document.getElementById("textos").textContent);
  const COL = ["var(--n0)", "var(--n1)", "var(--n2)", "var(--n3)", "var(--sd)"];
  const ZONA_HORARIA = { ar: "America/Argentina/Buenos_Aires", es: "Europe/Madrid", us: undefined }; // EE. UU.: la del navegador
  const FUENTES = { aca: "ACA", chj: "CHJ", ina: "INA", agp: "AGP", usgs: "USGS" };
  const REFRESCO_MS = 5 * 60 * 1000;
  const HIST_MS = 30 * 60 * 1000;
  const RANGOS_H = [48, 24 * 15, 24 * 92];

  let lang = "es", filtro = "all", rango = 1, pais = "es", desconocido = false, ficha = 0;
  const D = { indice: null, latest: null, prev: null, hist: {}, histT: 0, error: false, sinDatos: false };
  // Cada estación lleva su unidad tal como la publica la fuente (caudal, metros o pies); no se convierte.
  const uni = (e) => L.unidadTexto(e.unidad || "m3s");
  const val = (v, unidad) => L.formatoValor(v, unidad, lang);  // único punto de formato de una medida

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v) => L.formatoNumero(v, lang);
  const loc = () => L.localeDe(lang);
  const t = () => T[lang];
  const tp = () => T[lang].paises[pais];
  const tag = (nivel, sd, extra) => {
    const r = L.nivelRotulo(nivel, sd, lang);
    return `<span class="tag" style="--c:${COL[sd ? 4 : nivel]}"><span aria-hidden="true">${r.simbolo}</span> ${esc(r.texto)}${extra || ""}</span>`;
  };
  const hora = (iso) => {
    try { return new Date(iso).toLocaleString(loc(), { timeZone: ZONA_HORARIA[pais], timeZoneName: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return ""; }
  };

  // ---------- carga de datos ----------
  async function getJson(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) { const err = new Error(url + " " + r.status); err.status = r.status; throw err; }
    return r.json();
  }
  async function cargarHistorial(p) {
    const ahora = new Date();
    const meses = [0, 1, 2].map((k) => {
      const d = new Date(Date.UTC(ahora.getUTCFullYear(), ahora.getUTCMonth() - k, 1));
      return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0");
    });
    const docs = await Promise.all(meses.map((m) => getJson(L.rutaDatos(p, "history/" + m + ".json")).catch(() => ({}))));
    const h = {};
    docs.forEach((doc) => Object.keys(doc).forEach((id) => { h[id] = (h[id] || []).concat(doc[id]); }));
    Object.keys(h).forEach((id) => { h[id].sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0); });
    return h;
  }
  function vaciarPais() {
    D.latest = null; D.prev = null; D.hist = {}; D.histT = 0; D.error = false; D.sinDatos = false;
  }
  // Primero el índice (qué países tienen datos), después solo los archivos del país activo.
  async function cargar() {
    const mia = ++ficha, p = pais;
    try { D.indice = await getJson("data/paises.json"); } catch (e) { /* sin índice: se intenta el país igualmente */ }
    if (mia !== ficha) return;
    if (D.indice && !D.indice[p]) { vaciarPais(); D.sinDatos = true; render(); return; }
    try {
      const latest = await getJson(L.rutaDatos(p, "latest.json"));
      const prev = await getJson(L.rutaDatos(p, "prevision.json")).catch(() => null);
      let hist = D.hist, histT = D.histT;
      if (Date.now() - histT > HIST_MS) { hist = await cargarHistorial(p); histT = Date.now(); }
      if (mia !== ficha) return;
      D.latest = latest; D.prev = prev; D.hist = hist; D.histT = histT; D.error = false; D.sinDatos = false;
    } catch (e) {
      if (mia !== ficha) return;
      if (e.status === 404) { vaciarPais(); D.sinDatos = true; } else D.error = true;
    }
    render();
  }

  // ---------- piezas ----------
  function sparkline(puntos, u, nivel, sd, unidad) {
    const W = 300, H = 92, Lm = 4, R = 30, Tp = 8, B = 16;
    const vals = puntos.map((p) => p[1]);
    const tipoOk = u && u.tipo !== "en_estudio" && u.bajo != null;
    const { min: ymin, max: ymax } = L.rangoY(unidad, vals, tipoOk ? u.bajo : null);
    const t0 = Date.parse(puntos[0][0]), t1 = Date.parse(puntos[puntos.length - 1][0]) || t0 + 1;
    const X = (iso) => Lm + (W - Lm - R) * (Date.parse(iso) - t0) / Math.max(1, t1 - t0);
    const Y = (v) => Tp + (H - Tp - B) * (1 - (v - ymin) / (ymax - ymin));
    let d = "";
    puntos.forEach((p, i) => { d += (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1) + " "; });
    const area = d + `L${X(puntos[puntos.length - 1][0]).toFixed(1)} ${H - B} L${X(puntos[0][0]).toFixed(1)} ${H - B} Z`;
    let g = "";
    [0.25, 0.5, 0.75].forEach((f) => { const y = Tp + (H - Tp - B) * f; g += `<line class="gr" x1="${Lm}" x2="${W - R}" y1="${y}" y2="${y}"/>`; });
    if (tipoOk) ["bajo", "medio", "alto"].forEach((k, i) => {
      if (u[k] > ymax || u[k] < ymin) return;
      const y = Y(u[k]).toFixed(1);
      g += `<line class="tl" stroke="${COL[i + 1]}" x1="${Lm}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="lb" x="${W - R + 3}" y="${(+y + 3).toFixed(1)}">${L.letraUmbral(i, lang)}</text>`;
    });
    const c = COL[sd ? 4 : nivel];
    const last = puntos[puntos.length - 1];
    return `<svg class="sp" viewBox="0 0 ${W} ${H}" role="img" aria-label="48 h">${g}<path d="${area}" fill="${c}" opacity=".13"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" fill="${c}"/></svg>`;
  }

  function umbralesTexto(u, unidad) {
    if (!u || u.tipo === "en_estudio" || u.bajo == null) return t().thr_none;
    return `${L.letraUmbral(0, lang)} ${num(u.bajo)} · ${L.letraUmbral(1, lang)} ${num(u.medio)} · ${L.letraUmbral(2, lang)} ${val(u.alto, unidad)}`;
  }

  function bloquePrevision(e) {
    const p = D.prev && D.prev.estaciones && D.prev.estaciones[e.id];
    if (!p) return "";
    const chip = (p.puede_llegar && !e.sd)
      ? `<span class="tag fchip" style="--c:${COL[p.puede_llegar]}"><span aria-hidden="true">${L.nivelRotulo(p.puede_llegar, false, lang).simbolo}</span> ${esc(t().fcmay)} ${esc(L.nivelRotulo(p.puede_llegar, false, lang).texto)}</span>` : "";
    const q = e.unidad && e.unidad !== "m3s" ? "" : p.caudal ? `<span>${esc(t().fcq)}: <b>${num(p.caudal[0])}–${val(p.caudal[1], "m3s")}</b> <span class="sdnote">(${esc(t().fcwarn)})</span></span>` : `<span class="sdnote">${esc(t().fcnone)}</span>`;
    const lluvia = p.lluvia_48h_mm == null ? "" : `<span>${esc(t().rain48)}: <b>${val(p.lluvia_48h_mm, "mm")}</b></span>`;
    return `<div class="fc"><div class="fh">${esc(t().forecast_h)}</div><div class="fl">${lluvia}${q}</div>${chip}</div>`;
  }

  function tarjeta(g) {
    const e = g.principal, r = L.nivelRotulo(e.nivel, false, lang);
    const color = e.sd && e.nivel < 2 ? COL[4] : COL[e.nivel];
    const tags = e.sd
      ? tag(e.nivel, true) + `<span class="tag" style="--c:${COL[e.nivel]}" title="${esc(t().last_level)}"><span aria-hidden="true">${r.simbolo}</span> ${esc(r.texto)}</span>`
      : tag(e.nivel, false);
    const hist = D.hist[e.id] || [];
    const tend = L.tendencia(L.serieConActual(hist, e.t_utc, e.valor));
    const trTxt = e.sd || !tend ? "" : tend === "sube" ? `▲ ${t().rise}` : tend === "baja" ? `▼ ${t().fall}` : `● ${t().flat}`;
    const valor = e.valor == null
      ? `<div class="big" style="color:var(--sd)">—</div><div class="tr">${esc(t().no_value)}</div>`
      : `<div class="big">${num(e.valor)} <small>${esc(uni(e))}</small></div><div class="tr ${tend === "sube" && e.nivel >= 1 ? "up" : ""}">${esc(trTxt)}</div>`;
    const pts = L.filtrarRango(hist, Date.now(), 48);
    const spark = pts.length >= 3 ? sparkline(pts, e.umbrales, e.nivel, e.sd, e.unidad) : "";
    const lad = [1, 2, 3].map((k) => `<i class="${e.nivel >= k && !e.sd ? "on" : ""}" style="--c:${COL[k]}"></i>`).join("");
    const nota = e.sd ? `<div class="sdnote">${esc(t().sd_note)}</div>` : "";
    const detalle = `<details class="det" data-rio="${esc(g.rio)}"><summary>${esc(t().stations_of)} (${g.estaciones.length}) · ${esc(t().chart_title.toLowerCase())}</summary><div class="dbody"></div></details>`;
    return `<article class="card n${e.nivel}" style="--c:${color}">
      <div class="ch"><div><div class="rio">${esc(g.rio)}</div><div class="est">${esc(e.nombre)}</div></div><div class="tags">${tags}</div></div>
      <div class="val">${valor}</div>${spark}
      <div class="lad" aria-hidden="true">${lad}</div>${nota}
      ${bloquePrevision(e)}
      <div class="meta"><span>${esc(umbralesTexto(e.umbrales, e.unidad))}</span><span>${esc(L.tipoUmbralTexto(e.umbrales.tipo, lang))}</span></div>
      <div class="meta"><span>${esc(L.edadTexto(L.edadMin(e.t_utc, Date.now()), lang))}</span><span>${esc(t().source)}: ${esc(FUENTES[e.fuente] || e.fuente)}</span></div>
      ${detalle}
    </article>`;
  }

  // ---------- gráfico de detalle (d3) ----------
  function grafico(el, e) {
    const puntos = L.filtrarRango(D.hist[e.id] || [], Date.now(), RANGOS_H[rango]);
    el.innerHTML = "";
    if (!window.d3 || puntos.length < 2) { el.innerHTML = `<p class="empty">${esc(t().chart_empty)}</p>`; return; }
    const W = Math.max(280, el.clientWidth || 320), H = 180, m = { l: 38, r: 22, t: 10, b: 22 };
    const u = e.umbrales, conU = u && u.tipo !== "en_estudio" && u.bajo != null;
    const data = puntos.map((p) => ({ x: new Date(p[0]), y: p[1] }));
    const rg = L.rangoY(e.unidad || "m3s", data.map((d) => d.y), conU ? u.bajo : null);
    const x = d3.scaleTime().domain(d3.extent(data, (d) => d.x)).range([m.l, W - m.r]);
    const y = d3.scaleLinear().domain([rg.min, rg.max]).nice().range([H - m.b, m.t]);
    const svg = d3.select(el).append("svg").attr("class", "ch2").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img").attr("aria-label", t().chart_aria);
    svg.append("g").selectAll("line").data(y.ticks(4)).join("line").attr("class", "gr").attr("x1", m.l).attr("x2", W - m.r).attr("y1", (d) => y(d)).attr("y2", (d) => y(d));
    svg.append("g").selectAll("text").data(y.ticks(4)).join("text").attr("x", m.l - 5).attr("y", (d) => y(d) + 3).attr("text-anchor", "end").text((d) => d);
    svg.append("g").selectAll("text").data(x.ticks(4)).join("text").attr("x", (d) => x(d)).attr("y", H - 6).attr("text-anchor", "middle")
      .text((d) => d.toLocaleDateString(loc(), { day: "numeric", month: "short", hour: RANGOS_H[rango] <= 48 ? "2-digit" : undefined, timeZone: ZONA_HORARIA[pais] }));
    const c = COL[e.sd ? 4 : e.nivel];
    svg.append("path").datum(data).attr("fill", c).attr("opacity", 0.13).attr("d", d3.area().x((d) => x(d.x)).y0(H - m.b).y1((d) => y(d.y)));
    svg.append("path").datum(data).attr("fill", "none").attr("stroke", c).attr("stroke-width", 2).attr("stroke-linejoin", "round").attr("d", d3.line().x((d) => x(d.x)).y((d) => y(d.y)));
    if (conU) ["bajo", "medio", "alto"].forEach((k, i) => {
      if (u[k] > y.domain()[1] || u[k] < y.domain()[0]) return;
      svg.append("line").attr("class", "tl").attr("stroke", COL[i + 1]).attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(u[k])).attr("y2", y(u[k]));
      svg.append("text").attr("x", W - m.r + 3).attr("y", y(u[k]) + 3).text(L.letraUmbral(i, lang));
    });
  }

  function rellenarDetalle(det) {
    const g = L.agruparPorRio(D.latest.estaciones).find((x) => x.rio === det.dataset.rio);
    if (!g) return;
    const body = det.querySelector(".dbody");
    const botones = t().chart_ranges.map((r, i) => `<button data-r="${i}" aria-pressed="${i === rango}">${esc(r)}</button>`).join("");
    body.innerHTML = `<div class="seg rng" role="group">${botones}</div>` + g.estaciones.map((e) =>
      `<div class="srow"><div class="h"><b>${esc(e.nombre)}</b>${tag(e.nivel, e.sd)}</div>
        <div class="meta"><span>${esc(val(e.valor, e.unidad || "m3s"))}</span><span>${esc(L.edadTexto(L.edadMin(e.t_utc, Date.now()), lang))}</span></div>
        <div class="meta"><span>${esc(umbralesTexto(e.umbrales, e.unidad))}</span><span>${esc(L.tipoUmbralTexto(e.umbrales.tipo, lang))}</span></div>
        <div class="chbox" data-id="${esc(e.id)}"></div></div>`).join("");
    body.querySelectorAll(".chbox").forEach((el) => grafico(el, g.estaciones.find((e) => e.id === el.dataset.id)));
  }

  // ---------- secciones ----------
  function pintarResumen() {
    const est = D.latest.estaciones, r = L.resumenPorNivel(est);
    document.getElementById("tiles").innerHTML = [3, 2, 1, 0].map((n) => ({ n, c: r.niveles[n], col: COL[n], sd: false }))
      .concat([{ n: 4, c: r.sd, col: COL[4], sd: true }]).map((x) => {
        const rot = x.sd ? L.nivelRotulo(0, true, lang) : L.nivelRotulo(x.n, false, lang);
        return `<div class="tile" style="--c:${x.col}"><div class="k"><span aria-hidden="true">${rot.simbolo}</span> ${esc(rot.texto)}</div><div class="n">${x.c}</div><div class="r">${esc(t().tile_desc[x.n])}</div></div>`;
      }).join("");
  }

  function pintarAvisos() {
    const el = document.getElementById("avisos");
    const hay = !!(D.latest.fuentes_ok && "avisos" in D.latest.fuentes_ok);  // solo España tiene fuente de avisos hoy
    el.hidden = !hay;
    if (!hay) { el.innerHTML = ""; return; }
    const av = (D.latest.avisos || []).slice().sort((a, b) => L.nivelAviso(b.nivel) - L.nivelAviso(a.nivel));
    const item = (a) => {
      const n = L.nivelAviso(a.nivel), rot = L.nivelRotulo(n, false, lang);
      return `<div class="av"><span class="tag" style="--c:${COL[n]}"><span aria-hidden="true">${rot.simbolo}</span> ${esc(a.origen)} · ${esc(t().aviso_color[a.nivel] || a.nivel)}</span>
        <span>${esc(a.descripcion || a.zona)}</span><span class="src">${esc(a.zona)} · ${esc(t().avisos_desde)} ${esc(hora(a.t_utc))}</span></div>`;
    };
    const visibles = av.slice(0, 5), resto = av.slice(5);
    el.innerHTML = `<h2>${esc(t().avisos_title)}</h2>` +
      (av.length ? visibles.map(item).join("") : `<div class="sdnote">${esc(t().avisos_none)}</div>`) +
      (resto.length ? `<details><summary>${esc(t().avisos_more.replace("{n}", resto.length))}</summary>${resto.map(item).join("")}</details>` : "");
  }

  function pintarPrevision() {
    const el = document.getElementById("prev");
    const z = D.prev && D.prev.zonas;
    const claves = z ? Object.keys(t().zonas).filter((k) => z[k] && z[k].length) : [];
    if (!claves.length) { el.innerHTML = `<h2>${esc(t().prev_title)}</h2><div class="sdnote">${esc(t().prev_none)}</div>`; return; }
    const dias = z[claves[0]].map((d) => new Date(d.fecha + "T12:00:00Z").toLocaleDateString(loc(), { weekday: "short", day: "numeric", timeZone: "UTC" }));
    const nivLluvia = (mm) => mm >= 60 ? 3 : mm >= 30 ? 2 : mm >= 10 ? 1 : 0;
    el.innerHTML = `<h2>${esc(t().prev_title)}</h2><div class="pwrap"><table class="ptab"><thead><tr><th></th>${dias.map((d) => `<th>${esc(d)}</th>`).join("")}</tr></thead><tbody>` +
      claves.map((k) => `<tr><td class="z">${esc(t().zonas[k])}</td>${z[k].map((d) => `<td class="c" style="--c:${nivLluvia(d.mm) ? COL[nivLluvia(d.mm)] : "var(--line)"}"><b>${val(d.mm, "mm")}</b><small>${d.prob} %</small></td>`).join("")}</tr>`).join("") +
      `</tbody></table></div><p class="pnote">${esc(tp().prev_note)}</p>`;
  }

  function pintarBanners() {
    const b = [];
    if (desconocido) b.push(`<div class="banner">${esc(t().pais_desconocido.replace("{pais}", t().paises[pais].nombre))}</div>`);
    if (D.error) b.push(`<div class="banner err">${esc(t().error_load)}</div>`);
    if (D.latest) {
      if (L.datosViejos(D.latest.generado_utc, Date.now())) {
        const min = D.latest.generado_utc ? (Date.now() - Date.parse(D.latest.generado_utc)) / 60000 : null;
        const edad = min == null ? "—" : L.duracionTexto(min);
        b.push(`<div class="banner">${esc(t().banner_stale.replace("{edad}", edad))}</div>`);
      }
      const caidas = Object.keys(D.latest.fuentes_ok || {}).filter((k) => D.latest.fuentes_ok[k] === false).map((k) => t().fuentes_nombres[k] || k);
      if (caidas.length) b.push(`<div class="banner">${esc(t().banner_fuentes.replace("{lista}", caidas.join(", ")))}</div>`);
    }
    document.getElementById("banners").innerHTML = b.join("");
  }

  function pintarTarjetas() {
    const grid = document.getElementById("grid");
    if (!D.latest) { grid.innerHTML = `<p class="empty">${esc(D.sinDatos ? t().pais_sin_datos : D.error ? t().error_load : t().loading)}</p>`; return; }
    const abiertos = new Set([...grid.querySelectorAll("details.det[open]")].map((d) => d.dataset.rio));
    let grupos = L.agruparPorRio(D.latest.estaciones);
    if (filtro === "act") grupos = grupos.filter((g) => g.principal.nivel >= 1);
    grid.innerHTML = grupos.length ? grupos.map(tarjeta).join("") : `<p class="empty">${esc(t().filt_none)}</p>`;
    grid.querySelectorAll("details.det").forEach((d) => { if (abiertos.has(d.dataset.rio)) { d.open = true; rellenarDetalle(d); } });
  }

  // Cada pestaña lleva el nombre del país y, si hay estaciones en alerta, el símbolo del nivel más alto con su cuenta.
  function pintarPestanas() {
    document.getElementById("tabs").setAttribute("aria-label", t().tab_label);
    document.querySelectorAll("#tabs button").forEach((b) => {
      const p = b.dataset.p, sel = p === pais;
      const r = L.resumenPais(D.indice && D.indice[p]);
      const alto = r.porNivel.reduce((m, c, n) => (c > 0 && n > 0 ? n : m), 0);
      const enAlerta = r.porNivel[1] + r.porNivel[2] + r.porNivel[3];
      const rot = L.nivelRotulo(alto, false, lang);
      b.setAttribute("aria-selected", String(sel));
      b.tabIndex = sel ? 0 : -1;
      b.innerHTML = esc(t().paises[p].nombre) + (alto ? ` <span class="badge" style="--c:${COL[alto]}" title="${esc(rot.texto)}"><span aria-hidden="true">${rot.simbolo}</span> ${enAlerta}<span class="sr"> ${esc(rot.texto)}</span></span>` : "");
    });
    document.getElementById("panel").setAttribute("aria-labelledby", "tab-" + pais);
  }

  function irAPais(p, dejarHash) {
    if (p === pais && !dejarHash) return;
    pais = p; desconocido = false;
    vaciarPais();
    render();
    cargar();
  }

  function render() {
    const x = t();
    document.documentElement.lang = lang;
    document.getElementById("t-title").textContent = tp().titulo;
    document.getElementById("t-sub").textContent = tp().sub;
    document.title = tp().titulo + " · " + x.title;
    pintarPestanas();
    document.getElementById("t-est").textContent = x.est_title;
    const fb = document.querySelectorAll("#filt button");
    fb[0].textContent = x.filt_all; fb[1].textContent = x.filt_act;
    fb.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filtro)));
    document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
    document.getElementById("foot").innerHTML = tp().foot.concat(x.foot).map((p) => `<p>${p}</p>`).join("");
    pintarBanners();
    if (D.latest) { pintarResumen(); pintarAvisos(); pintarPrevision(); document.getElementById("prev").hidden = false; }
    else {
      document.getElementById("tiles").innerHTML = ""; document.getElementById("avisos").innerHTML = ""; document.getElementById("prev").innerHTML = "";
      document.getElementById("avisos").hidden = true; document.getElementById("prev").hidden = true;
    }
    pintarTarjetas();
  }

  // ---------- eventos ----------
  document.getElementById("lang").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    lang = b.dataset.l;
    try { localStorage.setItem("lang", lang); } catch (err) { /* sin almacenamiento: no pasa nada */ }
    render();
  });
  document.getElementById("filt").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { filtro = b.dataset.f; render(); } });
  document.getElementById("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-p]"); if (!b) return;
    if (location.hash === L.hashPara(b.dataset.p)) irAPais(b.dataset.p); else location.hash = L.hashPara(b.dataset.p);
  });
  document.getElementById("tabs").addEventListener("keydown", (e) => {
    const orden = L.PAISES, i = orden.indexOf(pais);
    const j = e.key === "ArrowRight" ? (i + 1) % orden.length : e.key === "ArrowLeft" ? (i + orden.length - 1) % orden.length
      : e.key === "Home" ? 0 : e.key === "End" ? orden.length - 1 : -1;
    if (j < 0) return;
    e.preventDefault();
    location.hash = L.hashPara(orden[j]);
    document.getElementById("tab-" + orden[j]).focus();
  });
  window.addEventListener("hashchange", () => {
    const p = L.paisDesdeHash(location.hash, pais);
    desconocido = !!location.hash.replace("#", "") && !L.PAISES.includes(location.hash.replace("#", "").toLowerCase());
    if (p !== pais) irAPais(p); else render();
  });
  document.getElementById("grid").addEventListener("toggle", (e) => { if (e.target.matches && e.target.matches("details.det") && e.target.open) rellenarDetalle(e.target); }, true);
  document.getElementById("grid").addEventListener("click", (e) => {
    const b = e.target.closest(".rng button"); if (!b) return;
    rango = +b.dataset.r;
    const det = b.closest("details.det"); if (det) rellenarDetalle(det);
  });

  let guardado = null;
  try { guardado = localStorage.getItem("lang"); } catch (err) { /* idem */ }
  lang = L.idiomaInicial(location.search, guardado, navigator.language);
  const crudo = location.hash.replace("#", "").toLowerCase();
  pais = L.paisDesdeHash(location.hash, L.paisPorIdioma(navigator.language));
  desconocido = !!crudo && !L.PAISES.includes(crudo);
  render();
  cargar();
  setInterval(cargar, REFRESCO_MS);
})();
</script>
</body>
</html>
